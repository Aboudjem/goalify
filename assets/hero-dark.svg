<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" role="img" aria-label="goalify, autonomous run prep for Claude Code: come back to proof, not a promise. It writes the brief and the condition; the run works from the file.">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="g-bloom" cx="0.5" cy="1" r="0.75">
      <stop offset="0%"  stop-color="#FF2D78" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="g-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD59A"/>
      <stop offset="30%"  stop-color="#FFB341"/>
      <stop offset="66%"  stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#8E7BFF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="g-rule" gradientUnits="userSpaceOnUse" x1="440" y1="112" x2="440" y2="272">
      <stop offset="0%"   stop-color="#8E7BFF" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#8E7BFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="g-horizonline" gradientUnits="userSpaceOnUse" x1="60" y1="332" x2="1140" y2="332">
      <stop offset="0%"   stop-color="#8E7BFF" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#8E7BFF" stop-opacity="0.5"/>
      <stop offset="55%"  stop-color="#C77DFF" stop-opacity="0.8"/>
      <stop offset="82%"  stop-color="#FF4D8D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="g-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="332" x2="0" y2="400">
      <stop offset="0%"   stop-color="#8E7BFF" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#C77DFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="g-pipramp" gradientUnits="userSpaceOnUse" x1="-6" y1="0" x2="94" y2="0">
      <stop offset="0%"   stop-color="#8E7BFF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="g-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="g-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="g-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="g-sunglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="g-sunclip">
      <circle cx="1096" cy="268" r="64"/>
    </clipPath>

    <clipPath id="g-gridclip">
      <rect x="0" y="332" width="1200" height="68"/>
    </clipPath>

    <clipPath id="g-wordclip">
      <text x="146" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="72" font-weight="800" letter-spacing="-2">goalify</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #8E7BFF; }
    .head    { font-size: 34px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.5px; }
    .sub     { font-size: 16px; font-weight: 500; fill: #B6C2DA; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #8494B0; }

    @keyframes g-breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: g-breathe 9s ease-in-out infinite; }

    @keyframes g-sunpulse { 0%,100% { opacity: 0.42; } 50% { opacity: 0.62; } }
    .sun { animation: g-sunpulse 10s ease-in-out infinite; }

    @keyframes g-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: g-flow 14s linear infinite; }

    @keyframes g-dot { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .d1 { animation: g-dot 5s ease-in-out infinite 0s; }
    .d2 { animation: g-dot 5s ease-in-out infinite 0.35s; }
    .d3 { animation: g-dot 5s ease-in-out infinite 0.7s; }
    .d4 { animation: g-dot 5s ease-in-out infinite 1.05s; }
    .d5 { animation: g-dot 5s ease-in-out infinite 1.4s; }

    @keyframes g-sheen {
      0%   { transform: translateX(0); }
      34%  { transform: translateX(560px); }
      100% { transform: translateX(560px); }
    }
    .sheen { animation: g-sheen 7.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="400" fill="url(#g-bg)"/>
  <ellipse class="bloom" cx="600" cy="404" rx="720" ry="190" fill="url(#g-bloom)"/>

  <!-- sun disc, sitting on the horizon at the right, behind everything -->
  <g class="sun">
    <g filter="url(#g-sunglow)">
      <circle cx="1096" cy="268" r="64" fill="url(#g-sun)"/>
    </g>
    <g clip-path="url(#g-sunclip)" fill="#080C16">
      <rect x="1024" y="278" width="144" height="3"/>
      <rect x="1024" y="288" width="144" height="4"/>
      <rect x="1024" y="299.5" width="144" height="5.5"/>
      <rect x="1024" y="313" width="144" height="7.5"/>
      <rect x="1024" y="329" width="144" height="10"/>
    </g>
  </g>

  <!-- perspective grid below the horizon, shipped off; flip this opacity to 1 to see it -->
  <g id="grid" clip-path="url(#g-gridclip)" opacity="0">
    <g stroke="url(#g-gridfade)" stroke-width="1" fill="none">
      <path d="M600 332 L-1180 400"/><path d="M600 332 L-560 400"/><path d="M600 332 L-190 400"/>
      <path d="M600 332 L40 400"/>   <path d="M600 332 L200 400"/>  <path d="M600 332 L320 400"/>
      <path d="M600 332 L415 400"/>  <path d="M600 332 L490 400"/>  <path d="M600 332 L548 400"/>
      <path d="M600 332 L600 400"/>
      <path d="M600 332 L652 400"/>  <path d="M600 332 L710 400"/>  <path d="M600 332 L785 400"/>
      <path d="M600 332 L880 400"/>  <path d="M600 332 L1000 400"/> <path d="M600 332 L1160 400"/>
      <path d="M600 332 L1390 400"/> <path d="M600 332 L1760 400"/> <path d="M600 332 L2380 400"/>
    </g>
    <g stroke="url(#g-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="335"   x2="1200" y2="335"/>
      <line x1="0" y1="339.5" x2="1200" y2="339.5"/>
      <line x1="0" y1="345.5" x2="1200" y2="345.5"/>
      <line x1="0" y1="353.5" x2="1200" y2="353.5"/>
      <line x1="0" y1="364"   x2="1200" y2="364"/>
      <line x1="0" y1="378"   x2="1200" y2="378"/>
      <line x1="0" y1="396"   x2="1200" y2="396"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="60" y1="332" x2="1140" y2="332" stroke="url(#g-horizonline)" stroke-width="1.25"/>
    <line class="flowline" x1="60" y1="332" x2="1140" y2="332" stroke="url(#g-horizonline)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <!-- mark: concentric target, one pin through the centre -->
  <g filter="url(#g-glow)">
    <g fill="none" stroke="url(#g-brand)" stroke-width="3">
      <circle cx="92" cy="182" r="34"/>
      <circle cx="92" cy="182" r="22" stroke-width="2.6" opacity="0.82"/>
      <circle cx="92" cy="182" r="10" stroke-width="2.4" opacity="0.66"/>
    </g>
    <line x1="56" y1="146" x2="116" y2="206" stroke="#C77DFF" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="52" cy="142" r="5.4" fill="#C77DFF"/>
    <circle cx="92" cy="182" r="3.8" fill="#F2F6FF"/>
  </g>

  <g filter="url(#g-glow)">
    <text class="disp" x="146" y="202" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#g-brand)">goalify</text>
  </g>

  <g clip-path="url(#g-wordclip)">
    <g transform="skewX(-18)">
      <rect class="sheen" x="-160" y="120" width="90" height="130" fill="url(#g-sheen)" opacity="0.7"/>
    </g>
  </g>

  <line x1="440" y1="112" x2="440" y2="272" stroke="url(#g-rule)" stroke-width="1.5"/>

  <g transform="translate(488,0)">
    <rect x="-14" y="116" width="262" height="24" rx="6" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/>
    <text class="mono eyebrow" x="0" y="132">AUTONOMOUS RUN PREP</text>
    <text class="disp head"   x="0" y="180">Come back to proof, not a promise</text>
    <text class="disp sub"    x="0" y="212">Writes the brief and the condition; the run works from the file.</text>

    <g transform="translate(0,248)">
      <g class="d1"><circle cx="0"  cy="0" r="4.5" fill="url(#g-pipramp)" filter="url(#g-glow-sm)"/></g>
      <g class="d2"><circle cx="22" cy="0" r="4.5" fill="url(#g-pipramp)" filter="url(#g-glow-sm)"/></g>
      <g class="d3"><circle cx="44" cy="0" r="4.5" fill="url(#g-pipramp)" filter="url(#g-glow-sm)"/></g>
      <g class="d4"><circle cx="66" cy="0" r="4.5" fill="url(#g-pipramp)" filter="url(#g-glow-sm)"/></g>
      <g class="d5"><circle cx="88" cy="0" r="4.5" fill="url(#g-pipramp)" filter="url(#g-glow-sm)"/></g>
      <text class="mono tag" x="114" y="4">THE BRIEF AND THE CONDITION</text>
    </g>
  </g>

  <text class="mono tag" x="60" y="318" opacity="0.85">authors, never executes  ·  one skill file  ·  runs locally</text>
</svg>
