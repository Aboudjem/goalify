<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" fill="none" role="img"
     aria-label="goalify, autonomous run prep: come back to proof, not a promise">
  <title>goalify</title>
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="52%" stop-color="#07060f"/>
      <stop offset="100%" stop-color="#060510"/>
    </linearGradient>
    <radialGradient id="hd-ba" cx="0.12" cy="0.12" r="0.50">
      <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hd-bb" cx="0.88" cy="0.88" r="0.46">
      <stop offset="0%" stop-color="#2ee6ff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hd-bc" cx="0.55" cy="0.04" r="0.38">
      <stop offset="0%" stop-color="#ff3d9a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff3d9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hd-ink" gradientUnits="userSpaceOnUse" x1="66" y1="56" x2="214" y2="204">
      <stop class="hdi1" offset="0%"   stop-color="#9b6bff"/>
      <stop class="hdi2" offset="52%"  stop-color="#6fa8ff"/>
      <stop class="hdi3" offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <linearGradient id="hd-word" x1="0" y1="0" x2="1" y2="0.22">
      <stop class="hdw1" offset="0%"   stop-color="#9b6bff"/>
      <stop class="hdw2" offset="46%"  stop-color="#7c9dff"/>
      <stop class="hdw3" offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <linearGradient id="hd-rule" gradientUnits="userSpaceOnUse" x1="524" y1="100" x2="524" y2="300">
      <stop offset="0%"   stop-color="#9b6bff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#9b6bff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#2ee6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hd-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hd-shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hd-frame"><rect width="1280" height="400"/></clipPath>
    <clipPath id="hd-wclip">
      <text x="76" y="286"
            font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
            font-size="114" font-weight="800" letter-spacing="-4">goalify</text>
    </clipPath>
    <filter id="hd-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hd-glow-sm" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .hd-disp { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .hd-mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }
    .hd-eye  { font-size:12.5px; font-weight:600; letter-spacing:4px; fill:#9b6bff; }
    .hd-head { font-size:36px; font-weight:700; fill:#f1edff; letter-spacing:-.5px; }
    .hd-sub  { font-size:16.5px; font-weight:500; fill:#a59cc9; }
    .hd-tag  { font-size:11.5px; letter-spacing:1.6px; fill:#8a82b6; }

    @keyframes hdi1 { 0%,100% { stop-color:#9b6bff; } 50% { stop-color:#b892ff; } }
    @keyframes hdi2 { 0%,100% { stop-color:#6fa8ff; } 50% { stop-color:#9b6bff; } }
    @keyframes hdi3 { 0%,100% { stop-color:#2ee6ff; } 50% { stop-color:#6fa8ff; } }
    .hdi1 { animation: hdi1 14s ease-in-out infinite; }
    .hdi2 { animation: hdi2 14s ease-in-out infinite 1.5s; }
    .hdi3 { animation: hdi3 14s ease-in-out infinite 3s; }

    @keyframes hdw1 { 0%,100% { stop-color:#9b6bff; } 50% { stop-color:#2ee6ff; } }
    @keyframes hdw2 { 0%,100% { stop-color:#7c9dff; } 50% { stop-color:#9b6bff; } }
    @keyframes hdw3 { 0%,100% { stop-color:#2ee6ff; } 50% { stop-color:#ff3d9a; } }
    .hdw1 { animation: hdw1 16s ease-in-out infinite; }
    .hdw2 { animation: hdw2 16s ease-in-out infinite 2s; }
    .hdw3 { animation: hdw3 16s ease-in-out infinite 4s; }

    @keyframes hd-breathe { 0%,100% { opacity:.65; } 50% { opacity:1; } }
    .hd-bloom { animation: hd-breathe 10s ease-in-out infinite; }

    @keyframes hd-ring { 0%,100% { opacity:.5; } 40%,60% { opacity:1; } }
    .hd-rl { animation: hd-ring 6s ease-in-out infinite; }

    @keyframes hd-fly {
      0% { transform: translate(52px,-52px); opacity:0; }
      10% { opacity:1; }
      35%,100% { transform: translate(0,0); opacity:1; }
    }
    .hd-pin { animation: hd-fly 6s cubic-bezier(.18,.72,.28,1) infinite; }

    @keyframes hd-pulse {
      0%,35% { r: 26px; opacity:0; }
      42% { opacity:.6; }
      75%,100% { r: 86px; opacity:0; }
    }
    .hd-pulse { animation: hd-pulse 6s cubic-bezier(.2,.6,.3,1) infinite; }

    @keyframes hd-check { 0%,30% { opacity:0; } 45%,100% { opacity:1; } }
    .hd-check { animation: hd-check 6s ease-in-out infinite; }

    @keyframes hd-sheen { 0% { transform:translateX(0); } 16%,100% { transform:translateX(530px); } }
    .hd-sheen { animation: hd-sheen 9s cubic-bezier(.4,0,.3,1) infinite; }

    @keyframes hd-pip { 0%,100% { opacity:.4; } 50% { opacity:1; } }
    .p1 { animation: hd-pip 5s ease-in-out infinite 0.0s; }
    .p2 { animation: hd-pip 5s ease-in-out infinite 0.4s; }
    .p3 { animation: hd-pip 5s ease-in-out infinite 0.8s; }
    .p4 { animation: hd-pip 5s ease-in-out infinite 1.2s; }
    .p5 { animation: hd-pip 5s ease-in-out infinite 1.6s; }

    @keyframes hd-tw-a { 0%,100% { opacity:.15; } 50% { opacity:.65; } }
    @keyframes hd-tw-b { 0%,100% { opacity:.30; } 50% { opacity:.90; } }
    @keyframes hd-tw-c { 0%,100% { opacity:.08; } 50% { opacity:.45; } }
    .ta1 { animation: hd-tw-a 7.0s ease-in-out infinite 0.0s; }
    .ta2 { animation: hd-tw-a 6.5s ease-in-out infinite 1.1s; }
    .ta3 { animation: hd-tw-a 8.0s ease-in-out infinite 2.3s; }
    .ta4 { animation: hd-tw-a 7.5s ease-in-out infinite 3.7s; }
    .ta5 { animation: hd-tw-a 6.8s ease-in-out infinite 0.8s; }
    .tb1 { animation: hd-tw-b 5.2s ease-in-out infinite 0.5s; }
    .tb2 { animation: hd-tw-b 4.8s ease-in-out infinite 2.0s; }
    .tb3 { animation: hd-tw-b 5.5s ease-in-out infinite 1.4s; }
    .tc1 { animation: hd-tw-c 9.0s ease-in-out infinite 0.3s; }
    .tc2 { animation: hd-tw-c 8.5s ease-in-out infinite 4.1s; }
    .tc3 { animation: hd-tw-c 9.5s ease-in-out infinite 2.7s; }
    .tc4 { animation: hd-tw-c 8.2s ease-in-out infinite 1.9s; }

    @keyframes hd-shoot {
      0%   { transform: translate(-320px, 50px) rotate(-22deg); opacity:0; }
      3%   { opacity:.80; }
      15%  { transform: translate(1800px, 50px) rotate(-22deg); opacity:0; }
      100% { transform: translate(1800px, 50px) rotate(-22deg); opacity:0; }
    }
    .hd-shoot { animation: hd-shoot 42s linear infinite 6s; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="400" fill="url(#hd-bg)"/>
  <g class="hd-bloom">
    <rect width="1280" height="400" fill="url(#hd-ba)"/>
    <rect width="1280" height="400" fill="url(#hd-bb)"/>
    <rect width="1280" height="400" fill="url(#hd-bc)"/>
  </g>

  <!-- Starfield: dim stars -->
  <circle class="ta1" cx="42"   cy="28"  r="0.9" fill="#ffffff"/>
  <circle class="ta2" cx="182"  cy="18"  r="1.0" fill="#ffffff"/>
  <circle class="ta3" cx="428"  cy="40"  r="0.8" fill="#ffffff"/>
  <circle class="ta4" cx="640"  cy="18"  r="0.9" fill="#ffffff"/>
  <circle class="ta5" cx="820"  cy="44"  r="0.8" fill="#ffffff"/>
  <circle class="ta1" cx="985"  cy="22"  r="1.0" fill="#ffffff"/>
  <circle class="ta2" cx="1178" cy="36"  r="0.8" fill="#ffffff"/>
  <circle class="tc1" cx="96"   cy="346" r="0.9" fill="#ffffff"/>
  <circle class="tc2" cx="558"  cy="366" r="0.8" fill="#ffffff"/>
  <circle class="tc3" cx="1084" cy="372" r="0.9" fill="#ffffff"/>
  <circle class="tc4" cx="870"  cy="356" r="0.8" fill="#ffffff"/>
  <circle class="ta3" cx="316"  cy="320" r="0.7" fill="#ffffff"/>
  <!-- Medium stars -->
  <circle class="tb1" cx="280"  cy="52"  r="1.2" fill="#ffffff"/>
  <circle class="tb2" cx="755"  cy="28"  r="1.1" fill="#ffffff"/>
  <circle class="tb3" cx="1244" cy="60"  r="1.3" fill="#ffffff"/>
  <!-- Cross-flare star 1 at (774, 78) -->
  <g class="tb1">
    <circle cx="774" cy="78" r="1.6" fill="#ffffff"/>
    <line x1="762" y1="78" x2="786" y2="78" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.45"/>
    <line x1="774" y1="66" x2="774" y2="90" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.45"/>
  </g>
  <!-- Cross-flare star 2 at (1196, 286) -->
  <g class="tb2">
    <circle cx="1196" cy="286" r="1.4" fill="#ffffff" fill-opacity="0.80"/>
    <line x1="1186" y1="286" x2="1206" y2="286" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.35"/>
    <line x1="1196" y1="276" x2="1196" y2="296" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.35"/>
  </g>
  <!-- Shooting star -->
  <g clip-path="url(#hd-frame)">
    <g class="hd-shoot">
      <rect x="0" y="-0.7" width="130" height="1.4" rx="0.7" fill="url(#hd-shoot)"/>
    </g>
  </g>

  <!-- Mark at (140, 200), scale 0.578 from 128,128 origin -->
  <g transform="translate(66,56) scale(0.5781)">
    <g fill="none" stroke="url(#hd-ink)" stroke-width="9" opacity="0.22">
      <circle cx="128" cy="128" r="26"/>
      <circle cx="128" cy="128" r="50"/>
      <circle cx="128" cy="128" r="74"/>
    </g>
    <g class="hd-rl" fill="none" stroke="url(#hd-ink)" stroke-width="9" filter="url(#hd-glow)">
      <circle cx="128" cy="128" r="26"/>
      <circle cx="128" cy="128" r="50"/>
      <circle cx="128" cy="128" r="74"/>
    </g>
    <circle class="hd-pulse" cx="128" cy="128" r="26" fill="none"
            stroke="#9b6bff" stroke-width="4" opacity="0"/>
    <g class="hd-pin">
      <g filter="url(#hd-glow)">
        <line x1="196" y1="60" x2="128" y2="128"
              stroke="url(#hd-ink)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <g transform="translate(128,128)" filter="url(#hd-glow-sm)">
        <circle r="11" fill="#07060f"/>
        <path class="hd-check" d="M-5.5 2 L-0.5 7 L9 -5"
              stroke="#3dffa8" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <g filter="url(#hd-glow)">
    <text class="hd-disp" x="76" y="286" font-size="114" font-weight="800"
          letter-spacing="-4" fill="url(#hd-word)">goalify</text>
  </g>
  <g clip-path="url(#hd-wclip)">
    <g transform="skewX(-18)">
      <rect class="hd-sheen" x="-48" y="172" width="52" height="152"
            fill="url(#hd-sheen)" opacity="0.40"/>
    </g>
  </g>

  <!-- Divider -->
  <line x1="524" y1="100" x2="524" y2="300" stroke="url(#hd-rule)" stroke-width="1.5"/>

  <!-- Right: text content -->
  <g transform="translate(560,0)">
    <text class="hd-mono hd-eye" x="0" y="136">AUTONOMOUS RUN PREP</text>
    <text class="hd-disp hd-head" x="0" y="192">Come back to proof, not a promise</text>
    <text class="hd-disp hd-sub" x="0" y="230">Writes the brief and the condition; the run works from the file.</text>
    <g transform="translate(0,270)">
      <g class="p1"><circle cx="0"   cy="0" r="4.5" fill="#9b6bff" filter="url(#hd-glow-sm)"/></g>
      <g class="p2"><circle cx="22"  cy="0" r="4.5" fill="#9b6bff" filter="url(#hd-glow-sm)"/></g>
      <g class="p3"><circle cx="44"  cy="0" r="4.5" fill="#9b6bff" filter="url(#hd-glow-sm)"/></g>
      <g class="p4"><circle cx="66"  cy="0" r="4.5" fill="#9b6bff" filter="url(#hd-glow-sm)"/></g>
      <g class="p5"><circle cx="88"  cy="0" r="4.5" fill="#9b6bff" filter="url(#hd-glow-sm)"/></g>
      <text class="hd-mono hd-tag" x="118" y="4">THE BRIEF AND THE CONDITION</text>
    </g>
  </g>
  <text class="hd-mono hd-tag" x="76" y="356">never does the task  &#183;  one skill file  &#183;  runs locally</text>
</svg>
