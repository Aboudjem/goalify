<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" fill="none" role="img"
     aria-label="goalify, autonomous run prep: come back to proof, not a promise">
  <title>goalify</title>
  <defs>
    <linearGradient id="hl-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f7f5ff"/>
      <stop offset="100%" stop-color="#ede9ff"/>
    </linearGradient>
    <radialGradient id="hl-ba" cx="0.12" cy="0.12" r="0.50">
      <stop offset="0%" stop-color="#7b47e8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7b47e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hl-bb" cx="0.88" cy="0.88" r="0.46">
      <stop offset="0%" stop-color="#00c4e0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00c4e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hl-bc" cx="0.55" cy="0.04" r="0.38">
      <stop offset="0%" stop-color="#e0006b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e0006b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl-ink" gradientUnits="userSpaceOnUse" x1="66" y1="56" x2="214" y2="204">
      <stop class="hli1" offset="0%"   stop-color="#7b47e8"/>
      <stop class="hli2" offset="52%"  stop-color="#5470d4"/>
      <stop class="hli3" offset="100%" stop-color="#00c4e0"/>
    </linearGradient>
    <linearGradient id="hl-word" x1="0" y1="0" x2="1" y2="0.22">
      <stop class="hlw1" offset="0%"   stop-color="#7b47e8"/>
      <stop class="hlw2" offset="46%"  stop-color="#4d6cd4"/>
      <stop class="hlw3" offset="100%" stop-color="#00c4e0"/>
    </linearGradient>
    <linearGradient id="hl-rule" gradientUnits="userSpaceOnUse" x1="524" y1="100" x2="524" y2="300">
      <stop offset="0%"   stop-color="#7b47e8" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#7b47e8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00c4e0" stop-opacity="0"/>
    </linearGradient>
    <filter id="hl-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hl-glow-sm" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .hl-disp { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .hl-mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }
    .hl-eye  { font-size:12.5px; font-weight:600; letter-spacing:4px; fill:#7b47e8; }
    .hl-head { font-size:36px; font-weight:700; fill:#1a0d3d; letter-spacing:-.5px; }
    .hl-sub  { font-size:16.5px; font-weight:500; fill:#5a4a7a; }
    .hl-tag  { font-size:11.5px; letter-spacing:1.6px; fill:#8070aa; }

    @keyframes hli1 { 0%,100% { stop-color:#7b47e8; } 50% { stop-color:#9b6bff; } }
    @keyframes hli2 { 0%,100% { stop-color:#5470d4; } 50% { stop-color:#7b47e8; } }
    @keyframes hli3 { 0%,100% { stop-color:#00c4e0; } 50% { stop-color:#5470d4; } }
    .hli1 { animation: hli1 14s ease-in-out infinite; }
    .hli2 { animation: hli2 14s ease-in-out infinite 1.5s; }
    .hli3 { animation: hli3 14s ease-in-out infinite 3s; }

    @keyframes hlw1 { 0%,100% { stop-color:#7b47e8; } 50% { stop-color:#00c4e0; } }
    @keyframes hlw2 { 0%,100% { stop-color:#4d6cd4; } 50% { stop-color:#7b47e8; } }
    @keyframes hlw3 { 0%,100% { stop-color:#00c4e0; } 50% { stop-color:#e0006b; } }
    .hlw1 { animation: hlw1 16s ease-in-out infinite; }
    .hlw2 { animation: hlw2 16s ease-in-out infinite 2s; }
    .hlw3 { animation: hlw3 16s ease-in-out infinite 4s; }

    @keyframes hl-breathe { 0%,100% { opacity:.70; } 50% { opacity:1; } }
    .hl-bloom { animation: hl-breathe 10s ease-in-out infinite; }

    @keyframes hl-ring { 0%,100% { opacity:.55; } 40%,60% { opacity:1; } }
    .hl-rl { animation: hl-ring 6s ease-in-out infinite; }

    @keyframes hl-fly {
      0% { transform: translate(52px,-52px); opacity:0; }
      10% { opacity:1; }
      35%,100% { transform: translate(0,0); opacity:1; }
    }
    .hl-pin { animation: hl-fly 6s cubic-bezier(.18,.72,.28,1) infinite; }

    @keyframes hl-pulse {
      0%,35% { r: 26px; opacity:0; }
      42% { opacity:.5; }
      75%,100% { r: 86px; opacity:0; }
    }
    .hl-pulse { animation: hl-pulse 6s cubic-bezier(.2,.6,.3,1) infinite; }

    @keyframes hl-check { 0%,30% { opacity:0; } 45%,100% { opacity:1; } }
    .hl-check { animation: hl-check 6s ease-in-out infinite; }

    @keyframes hl-pip { 0%,100% { opacity:.4; } 50% { opacity:1; } }
    .lp1 { animation: hl-pip 5s ease-in-out infinite 0.0s; }
    .lp2 { animation: hl-pip 5s ease-in-out infinite 0.4s; }
    .lp3 { animation: hl-pip 5s ease-in-out infinite 0.8s; }
    .lp4 { animation: hl-pip 5s ease-in-out infinite 1.2s; }
    .lp5 { animation: hl-pip 5s ease-in-out infinite 1.6s; }

    @keyframes hl-tw-a { 0%,100% { opacity:.08; } 50% { opacity:.28; } }
    @keyframes hl-tw-b { 0%,100% { opacity:.12; } 50% { opacity:.40; } }
    .lta1 { animation: hl-tw-a 7.0s ease-in-out infinite 0.0s; }
    .lta2 { animation: hl-tw-a 6.5s ease-in-out infinite 1.1s; }
    .lta3 { animation: hl-tw-a 8.0s ease-in-out infinite 2.3s; }
    .ltb1 { animation: hl-tw-b 5.2s ease-in-out infinite 0.5s; }
    .ltb2 { animation: hl-tw-b 4.8s ease-in-out infinite 2.0s; }
    .ltb3 { animation: hl-tw-b 5.5s ease-in-out infinite 1.4s; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="400" fill="url(#hl-bg)"/>
  <g class="hl-bloom">
    <rect width="1280" height="400" fill="url(#hl-ba)"/>
    <rect width="1280" height="400" fill="url(#hl-bb)"/>
    <rect width="1280" height="400" fill="url(#hl-bc)"/>
  </g>

  <!-- Subtle dot field for light mode (very faint) -->
  <circle class="lta1" cx="182"  cy="18"  r="1.0" fill="#7b47e8"/>
  <circle class="lta2" cx="640"  cy="18"  r="0.9" fill="#7b47e8"/>
  <circle class="lta3" cx="985"  cy="22"  r="1.0" fill="#7b47e8"/>
  <circle class="ltb1" cx="280"  cy="52"  r="1.2" fill="#7b47e8"/>
  <circle class="ltb2" cx="755"  cy="28"  r="1.1" fill="#7b47e8"/>
  <circle class="ltb3" cx="1244" cy="60"  r="1.2" fill="#7b47e8"/>

  <!-- Mark -->
  <g transform="translate(66,56) scale(0.5781)">
    <g fill="none" stroke="url(#hl-ink)" stroke-width="9" opacity="0.26">
      <circle cx="128" cy="128" r="26"/>
      <circle cx="128" cy="128" r="50"/>
      <circle cx="128" cy="128" r="74"/>
    </g>
    <g class="hl-rl" fill="none" stroke="url(#hl-ink)" stroke-width="9" filter="url(#hl-glow)">
      <circle cx="128" cy="128" r="26"/>
      <circle cx="128" cy="128" r="50"/>
      <circle cx="128" cy="128" r="74"/>
    </g>
    <circle class="hl-pulse" cx="128" cy="128" r="26" fill="none"
            stroke="#7b47e8" stroke-width="4" opacity="0"/>
    <g class="hl-pin">
      <g filter="url(#hl-glow)">
        <line x1="196" y1="60" x2="128" y2="128"
              stroke="url(#hl-ink)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <g transform="translate(128,128)" filter="url(#hl-glow-sm)">
        <circle r="11" fill="#f7f5ff"/>
        <path class="hl-check" d="M-5.5 2 L-0.5 7 L9 -5"
              stroke="#00a86b" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <text class="hl-disp" x="76" y="286" font-size="114" font-weight="800"
        letter-spacing="-4" fill="url(#hl-word)">goalify</text>

  <!-- Divider -->
  <line x1="524" y1="100" x2="524" y2="300" stroke="url(#hl-rule)" stroke-width="1.5"/>

  <!-- Right: text content -->
  <g transform="translate(560,0)">
    <text class="hl-mono hl-eye" x="0" y="136">AUTONOMOUS RUN PREP</text>
    <text class="hl-disp hl-head" x="0" y="192">Come back to proof, not a promise</text>
    <text class="hl-disp hl-sub" x="0" y="230">Writes the brief and the condition; the run works from the file.</text>
    <g transform="translate(0,270)">
      <g class="lp1"><circle cx="0"  cy="0" r="4.5" fill="#7b47e8"/></g>
      <g class="lp2"><circle cx="22" cy="0" r="4.5" fill="#7b47e8"/></g>
      <g class="lp3"><circle cx="44" cy="0" r="4.5" fill="#7b47e8"/></g>
      <g class="lp4"><circle cx="66" cy="0" r="4.5" fill="#7b47e8"/></g>
      <g class="lp5"><circle cx="88" cy="0" r="4.5" fill="#7b47e8"/></g>
      <text class="hl-mono hl-tag" x="118" y="4">THE BRIEF AND THE CONDITION</text>
    </g>
  </g>
  <text class="hl-mono hl-tag" x="76" y="356">never does the task  &#183;  one skill file  &#183;  runs locally</text>
</svg>
