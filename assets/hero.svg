<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" role="img" aria-labelledby="h-t h-d">
  <title id="h-t">goalify: what you type, and what you get back</title>
  <desc id="h-d">You run /goalify migrate our API to async/await. goalify writes a brief — the file ~/acme/.goal/api-migration.md, which the worker opens — and a condition string. You /clear, then paste the condition after /goal: "Read and fully execute the brief at ~/acme/.goal/api-migration.md, done when the last turn quotes npm test passing and says ASYNC-OK, 40 turns max". The condition names the brief by path, which is how the run finds it. Handing /goal that path on its own is shown struck through, because the evaluator cannot open files. The run ends at GOAL COMPLETE — or stops early, which is not the same thing, so either way you re-check it.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .cmd{font-size:32px;font-weight:700}
    .said{font-size:30px;font-weight:500;fill:#6E7887}
    .head{font-size:34px;font-weight:800}
    .tag{font-size:28px;font-weight:700;letter-spacing:1.5px}
    .val{font-size:28px;font-weight:500;fill:#3F3A36}
    .note{font-size:28px;font-weight:400;fill:#6B5F57}
    .step{font-size:28px;font-weight:400;fill:#828C9A}
    .key{font-size:28px;font-weight:600}
    .done{font-size:32px;font-weight:800;fill:#3F8F5F;letter-spacing:1px}

    /* Opacity only, plus marching dashes on one 56-unit rule. Fastest feature 0.2 Hz,
       slowest 0.09 Hz — WCAG 2.3.1 draws the line at 3 Hz. prefers-reduced-motion does
       not reach an img-embedded SVG, so nothing here relies on the user opting out.
       Nothing meaning-bearing animates from zero: every frame is a complete diagram,
       which matters because README images get screenshotted. The struck-through
       counter-example is deliberately excluded from all motion — a reader who catches
       any single frame must never see it un-negated. */
    .flow{animation:h-flow 5s linear infinite}
    .glowA{animation:h-breathe 11s ease-in-out infinite}
    .glowB{animation:h-breathe 11s ease-in-out infinite -5.5s}
    .tick{animation:h-breathe 11s ease-in-out infinite -2.75s}
    @keyframes h-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
    @keyframes h-breathe{0%,100%{opacity:.7}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .flow,.glowA,.glowB,.tick{animation:none;opacity:1}
    }
  </style>

  <!-- ── what you type ──────────────────────────────────────────────────── -->
  <text x="40" y="46"><tspan class="mono cmd" fill="#C2643F">/goalify</tspan><tspan class="sans said" dx="18">migrate our API to async/await</tspan></text>
  <line x1="40" y1="68" x2="860" y2="68" stroke="#6E7887" stroke-width="1.5" opacity=".28"/>

  <!-- ── artifact 1: the brief. A file, so it is drawn as one. ──────────── -->
  <path d="M56 86 H816 L860 130 V164 Q860 180 844 180 H56 Q40 180 40 164 V102 Q40 86 56 86 Z"
        fill="#FBF1EA" stroke="#C2643F" stroke-width="2.5"/>
  <path d="M816 86 L860 130 H816 Z" fill="#EFD9C9" stroke="#C2643F" stroke-width="2.5"
        stroke-linejoin="round"/>
  <text class="sans head" x="72" y="124" fill="#7C2D12">BRIEF</text>
  <text class="sans tag glowA" x="770" y="122" text-anchor="end" fill="#C2643F">A FILE</text>
  <text class="mono val" x="72" y="164">~/acme/.goal/api-migration.md</text>
  <text class="sans note" x="828" y="164" text-anchor="end">the worker opens it</text>

  <!-- ── you clear, then paste artifact 2 ───────────────────────────────── -->
  <text class="mono key" x="68" y="216" fill="#6E7887">/clear</text>
  <text class="sans step" x="180" y="216">then paste this, whole:</text>
  <line class="flow" x1="42" y1="182" x2="42" y2="238" stroke="#7C6AF0" stroke-width="3"
        stroke-dasharray="7 9" opacity=".75"/>

  <!-- ── artifact 2: the condition. `/goal` is the COMMAND and sits outside the
         plate; the plate is the ARGUMENT. Keeping them visually separate is the
         whole point — the condition is the string, not the string plus the verb.
         It names the brief by path, which is how the run ever finds the file. ── -->
  <text class="mono key" x="40" y="342" fill="#4C3FBF" font-weight="700">/goal</text>
  <rect x="140" y="248" width="720" height="250" rx="26" fill="#EFEDFB"
        stroke="#7C6AF0" stroke-width="2.5"/>
  <line x1="158" y1="272" x2="158" y2="474" stroke="#7C6AF0" stroke-width="7" stroke-linecap="round"/>
  <text class="sans head" x="180" y="292" fill="#312A85">CONDITION</text>
  <text class="sans tag glowB" x="828" y="290" text-anchor="end" fill="#7C6AF0">ONE STRING, WRAPPED</text>
  <text class="mono val" x="180" y="336">Read and fully execute the brief at</text>
  <text class="mono val" x="180" y="370">~/acme/.goal/api-migration.md,</text>
  <text class="mono val" x="180" y="404">done when the last turn QUOTES npm test</text>
  <text class="mono val" x="180" y="438">passing and says ASYNC-OK. 40 turns max.</text>
  <text class="sans note" x="180" y="476" fill="#5C5852">worker acts on it · evaluator judges it</text>

  <!-- The counter-example. Struck at full opacity in every frame, never animated.
       data-antipattern="v1" is what lets the flattened-text gate in
       tests/test_manifests.py tell a negated example from an instruction.
       It uses the SAME path as the condition above, so the contrast is exactly
       "the whole string" versus "only the path it names". -->
  <g data-antipattern="v1">
    <text class="sans step" x="64" y="538">not:</text>
    <text class="mono step" x="140" y="538">/goal ~/acme/.goal/api-migration.md</text><!-- v1-antipattern -->
    <line x1="140" y1="529" x2="728" y2="529" stroke="#C2643F" stroke-width="2.5"/>
    <text class="sans step" x="140" y="572">— the evaluator cannot open this file or check what is in it</text>
  </g>

  <!-- ── the finish line ────────────────────────────────────────────────── -->
  <line x1="40" y1="600" x2="860" y2="600" stroke="#6E7887" stroke-width="1.5" opacity=".28"/>
  <path class="tick" d="M42 632 l12 14 l26 -32" fill="none" stroke="#3F8F5F" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sans done" x="98" y="644">GOAL COMPLETE</text>
  <path d="M46 668 L68 690 M68 668 L46 690" stroke="#828C9A" stroke-width="4" stroke-linecap="round"/>
  <text class="sans step" x="98" y="686">STOPPED EARLY — a different outcome, not this one</text>
  <text class="sans step" x="46" y="726">Neither is proof. Re-run the checks yourself before you believe it.</text>
</svg>
