<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1040" fill="none" role="img" aria-label="how goalify works: five steps from describe job to verified proof">
  <title>How goalify works: five steps from describe job to verified proof</title>
  <desc>A vertical flow diagram with five numbered steps. Two rails run along the left. The brief rail starts at step one and continues all the way to step five. The condition rail appears at steps two through four. Step one: describe the job. Step two: goalify writes brief and condition. Step three: paste the full condition string into the goal command. Step four: claude runs non-stop, no interruptions. Step five: come back to verified proof.</desc>
  <defs>
    <linearGradient id="hiw-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#0d0b1a"/>
      <stop offset="55%"  stop-color="#07060f"/>
      <stop offset="100%" stop-color="#060510"/>
    </linearGradient>
    <radialGradient id="hiw-gA" cx="0.1" cy="0.1" r="0.7">
      <stop offset="0%"   stop-color="#9b6bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hiw-gB" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0%"   stop-color="#2ee6ff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hiw-brand" x1="0" y1="0" x2="1" y2="0">
      <stop class="hd1" offset="0%"   stop-color="#9b6bff"/>
      <stop class="hd2" offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <linearGradient id="hiw-brief-rail" gradientUnits="userSpaceOnUse" x1="64" y1="120" x2="64" y2="980">
      <stop offset="0%"   stop-color="#9b6bff" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hiw-cond-rail" gradientUnits="userSpaceOnUse" x1="84" y1="330" x2="84" y2="740">
      <stop offset="0%"   stop-color="#ff3d9a" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#ff3d9a" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="hiw-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .hiw { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .hiwm { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }

    @keyframes hd1 { 0%,100% { stop-color:#9b6bff; } 50% { stop-color:#2ee6ff; } }
    @keyframes hd2 { 0%,100% { stop-color:#2ee6ff; } 50% { stop-color:#ff3d9a; } }
    .hd1 { animation: hd1 18s ease-in-out infinite; }
    .hd2 { animation: hd2 18s ease-in-out infinite 3s; }

    @keyframes hiw-bloom { 0%,100% { opacity:.65; } 50% { opacity:1; } }
    .hiw-bloom { animation: hiw-bloom 12s ease-in-out infinite; }

    @keyframes hiw-flow { to { stroke-dashoffset: -300; } }
    .hiw-flow-b { stroke: #9b6bff; animation: hiw-flow 18s linear infinite; }
    .hiw-flow-c { stroke: #ff3d9a; animation: hiw-flow 18s linear infinite 6s; }

    @keyframes hiw-step { from { transform:translateX(-8px); } to { opacity:1; transform:translateX(0); } }
    .hs1 { animation: hiw-step 0.5s ease-out 0.4s both; }
    .hs2 { animation: hiw-step 0.5s ease-out 0.9s both; }
    .hs3 { animation: hiw-step 0.5s ease-out 1.4s both; }
    .hs4 { animation: hiw-step 0.5s ease-out 1.9s both; }
    .hs5 { animation: hiw-step 0.5s ease-out 2.4s both; }

    @keyframes hiw-tw { 0%,100% { opacity:.10; } 50% { opacity:.55; } }
    .ht1 { animation: hiw-tw 7s ease-in-out infinite 0s; }
    .ht2 { animation: hiw-tw 9s ease-in-out infinite 3s; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="900" height="1040" fill="url(#hiw-bg)"/>
  <g class="hiw-bloom">
    <rect width="900" height="1040" fill="url(#hiw-gA)"/>
    <rect width="900" height="1040" fill="url(#hiw-gB)"/>
  </g>
  <rect x="1.5" y="1.5" width="897" height="1037" rx="24"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="1.5" rx="0.75"
        fill="#ffffff" fill-opacity="0.15"/>

  <!-- stars -->
  <circle class="ht1" cx="820" cy="80"  r="1.0" fill="#ffffff"/>
  <circle class="ht2" cx="60"  cy="700" r="0.9" fill="#ffffff"/>
  <circle class="ht1" cx="840" cy="600" r="0.8" fill="#ffffff"/>

  <!-- Masthead -->
  <g filter="url(#hiw-glow)">
    <g fill="none" stroke="url(#hiw-brand)" stroke-width="2.2">
      <circle cx="70" cy="52" r="19"/>
      <circle cx="70" cy="52" r="12" stroke-width="1.8" opacity="0.80"/>
      <circle cx="70" cy="52" r="5"  stroke-width="1.5" opacity="0.62"/>
    </g>
    <line x1="49" y1="31" x2="84" y2="66" stroke="#2ee6ff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="46" cy="28" r="3" fill="#2ee6ff"/>
    <circle cx="70" cy="52" r="2.2" fill="#3dffa8"/>
    <text class="hiw" x="104" y="66" font-size="40" font-weight="800"
          letter-spacing="-1.2" fill="url(#hiw-brand)">how it works</text>
  </g>

  <!-- RAILS -->
  <!-- Brief rail: x=64, full height from step1 to step5 -->
  <line x1="64" y1="120" x2="64" y2="980"
        stroke="url(#hiw-brief-rail)" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="120" x2="64" y2="980"
        class="hiw-flow-b" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="4 12" opacity="0.50"/>
  <!-- Brief rail label -->
  <rect x="36" y="94" width="56" height="22" rx="11"
        fill="#9b6bff" fill-opacity="0.18"
        stroke="#9b6bff" stroke-opacity="0.50" stroke-width="1"/>
  <text class="hiw" x="64" y="109" font-size="12" font-weight="700"
        text-anchor="middle" fill="#9b6bff" letter-spacing="0.5">BRIEF</text>

  <!-- Condition rail: x=84, steps 2-4 -->
  <line x1="84" y1="330" x2="84" y2="740"
        stroke="url(#hiw-cond-rail)" stroke-width="3" stroke-linecap="round"/>
  <line x1="84" y1="330" x2="84" y2="740"
        class="hiw-flow-c" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="4 12" opacity="0.50"/>

  <!-- STEP 1: x=108 -->
  <g class="hs1">
    <circle cx="64" cy="170" r="18" fill="#9b6bff" fill-opacity="0.20"
            stroke="#9b6bff" stroke-opacity="0.60" stroke-width="1.5"/>
    <text class="hiw" x="64" y="176" font-size="18" font-weight="800"
          text-anchor="middle" fill="#9b6bff">1</text>
    <!-- Card -->
    <rect x="108" y="146" width="760" height="90" rx="20"
          fill="#ffffff" fill-opacity="0.04"
          stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="109" y="147" width="758" height="1.5" rx="0.75"
          fill="#ffffff" fill-opacity="0.18"/>
    <text class="hiw" font-size="26" font-weight="700" x="138" y="182"
          fill="#f1edff">Describe the job.</text>
    <text class="hiwm" font-size="22" x="138" y="218" fill="#9b6bff">/goalify migrate our API</text>
  </g>

  <!-- STEP 2: y~280 -->
  <g class="hs2">
    <circle cx="64" cy="310" r="18" fill="#9b6bff" fill-opacity="0.20"
            stroke="#9b6bff" stroke-opacity="0.60" stroke-width="1.5"/>
    <text class="hiw" x="64" y="316" font-size="18" font-weight="800"
          text-anchor="middle" fill="#9b6bff">2</text>
    <!-- Card -->
    <rect x="108" y="286" width="760" height="112" rx="20"
          fill="#ffffff" fill-opacity="0.04"
          stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="109" y="287" width="758" height="1.5" rx="0.75"
          fill="#ffffff" fill-opacity="0.18"/>
    <text class="hiw" font-size="26" font-weight="700" x="138" y="322"
          fill="#f1edff">goalify writes two things.</text>
    <!-- two pills -->
    <rect x="138" y="334" width="130" height="46" rx="23"
          fill="#9b6bff" fill-opacity="0.22"
          stroke="#9b6bff" stroke-opacity="0.55" stroke-width="1.5"/>
    <text class="hiw" font-size="20" font-weight="800" x="203" y="362"
          text-anchor="middle" fill="#9b6bff">BRIEF</text>
    <text class="hiw" font-size="22" x="280" y="362" fill="#4a4468">+</text>
    <rect x="304" y="334" width="186" height="46" rx="23"
          fill="#ff3d9a" fill-opacity="0.22"
          stroke="#ff3d9a" stroke-opacity="0.55" stroke-width="1.5"/>
    <text class="hiw" font-size="20" font-weight="800" x="397" y="362"
          text-anchor="middle" fill="#ff3d9a">CONDITION</text>
    <text class="hiw" font-size="22" font-weight="500" x="504" y="362"
          fill="#a59cc9">a file and one line</text>
  </g>

  <!-- STEP 3: y~440 -->
  <g class="hs3">
    <circle cx="64" cy="470" r="18" fill="#9b6bff" fill-opacity="0.20"
            stroke="#9b6bff" stroke-opacity="0.60" stroke-width="1.5"/>
    <text class="hiw" x="64" y="476" font-size="18" font-weight="800"
          text-anchor="middle" fill="#9b6bff">3</text>
    <!-- Card -->
    <rect x="108" y="446" width="760" height="148" rx="20"
          fill="#ffffff" fill-opacity="0.04"
          stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="109" y="447" width="758" height="1.5" rx="0.75"
          fill="#ffffff" fill-opacity="0.18"/>
    <text class="hiw" font-size="26" font-weight="700" x="138" y="482"
          fill="#f1edff">/clear, then paste the condition into</text>
    <rect x="598" y="452" width="108" height="40" rx="12"
          fill="#ffffff" fill-opacity="0.10"
          stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <text class="hiwm" font-size="24" font-weight="700" x="652" y="479"
          text-anchor="middle" fill="#f1edff">/goal</text>
    <!-- condition string -->
    <rect x="138" y="498" width="714" height="78" rx="16"
          fill="#ff3d9a" fill-opacity="0.08"
          stroke="#ff3d9a" stroke-opacity="0.35" stroke-width="1.5"/>
    <text class="hiwm" font-size="20" x="162" y="530" fill="#f1edff">Do everything in ~/acme/.goal/api-migration.md</text>
    <text class="hiwm" font-size="20" x="162" y="566" fill="#f1edff">and prove it, done when npm test passes. ASYNC-OK.</text>
  </g>

  <!-- STEP 4: y~634 -->
  <g class="hs4">
    <circle cx="64" cy="660" r="18" fill="#9b6bff" fill-opacity="0.20"
            stroke="#9b6bff" stroke-opacity="0.60" stroke-width="1.5"/>
    <text class="hiw" x="64" y="666" font-size="18" font-weight="800"
          text-anchor="middle" fill="#9b6bff">4</text>
    <!-- Card -->
    <rect x="108" y="636" width="760" height="106" rx="20"
          fill="#ffffff" fill-opacity="0.04"
          stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="109" y="637" width="758" height="1.5" rx="0.75"
          fill="#ffffff" fill-opacity="0.18"/>
    <text class="hiw" font-size="26" font-weight="700" x="138" y="672"
          fill="#f1edff">Claude runs. No interruptions.</text>
    <!-- pulse dots = busy indicator -->
    <circle cx="138" cy="714" r="6" fill="#2ee6ff" opacity="0.85"/>
    <circle cx="162" cy="714" r="6" fill="#2ee6ff" opacity="0.60"/>
    <circle cx="186" cy="714" r="6" fill="#2ee6ff" opacity="0.35"/>
    <text class="hiw" font-size="22" x="210" y="720" fill="#a59cc9">hours or days, zero check-ins needed</text>
  </g>

  <!-- STEP 5: y~782 -->
  <g class="hs5">
    <circle cx="64" cy="810" r="18" fill="#3dffa8" fill-opacity="0.25"
            stroke="#3dffa8" stroke-opacity="0.70" stroke-width="1.5"/>
    <text class="hiw" x="64" y="816" font-size="18" font-weight="800"
          text-anchor="middle" fill="#3dffa8">5</text>
    <!-- Card - green accent -->
    <rect x="108" y="786" width="760" height="148" rx="20"
          fill="#ffffff" fill-opacity="0.04"
          stroke="#3dffa8" stroke-opacity="0.30" stroke-width="1.5"/>
    <rect x="109" y="787" width="758" height="1.5" rx="0.75"
          fill="#3dffa8" fill-opacity="0.22"/>
    <rect x="108" y="786" width="7" height="148" rx="3.5" fill="#3dffa8"/>
    <text class="hiw" font-size="26" font-weight="700" x="138" y="822"
          fill="#3dffa8">Come back to proof.</text>
    <text class="hiw" font-size="22" font-weight="500" x="138" y="854"
          fill="#a59cc9">The condition is your receipt. It says exactly what passed.</text>
    <!-- proof line -->
    <rect x="138" y="868" width="714" height="52" rx="14"
          fill="#3dffa8" fill-opacity="0.08"
          stroke="#3dffa8" stroke-opacity="0.35" stroke-width="1.5"/>
    <text class="hiwm" font-size="22" x="162" y="902" fill="#3dffa8">npm test passing  ·  ASYNC-OK  ·  .goal/done/</text>
  </g>

  <!-- Footer rule -->
  <line x1="48" y1="970" x2="852" y2="970" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text class="hiw" font-size="20" font-weight="600" x="450" y="1010"
        text-anchor="middle" fill="#4a4468">goalify · a Claude Code skill</text>
</svg>
