<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="hiw-t hiw-d">
  <title id="hiw-t">How goalify works — five steps down a staircase, and which artifact governs each one</title>
  <desc id="hiw-d">A staircase of five indented rows. Step 1: goalify runs while the context is still hot, shown by a meter at ninety per cent. Step 2: clear the session, so the run starts with full context again. Step 3: paste the condition — the string, not the path — into the command chip. This is the hand-off: a solid warm rail carrying the brief runs down steps 1 to 3, and a dashed cool rail carrying the condition takes over from step 3 down to step 5, the two crossing at step 3's left edge. Step 4: the closing turn reruns every check and quotes npm test, saying ASYNC-OK. Step 5: the brief archives itself into the done folder, where the warm chip comes to rest.</desc>
  <defs>
    <linearGradient id="hiw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150A28"/>
      <stop offset="1" stop-color="#0C0518"/>
    </linearGradient>
    <radialGradient id="hiw-glow" cx="0.18" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#8A00FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8A00FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hiw-dots" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#2A1A47"/>
    </pattern>
    <clipPath id="hiw-clip"><rect x="2" y="2" width="896" height="716" rx="24"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    /* One faint highlight travels the five rows as five overlay bands, 10s = 0.10 Hz.
       The bands carry no information — their peak is .06 — and the rows, rails, chips and
       text under them never move and never change opacity, so every frame is the whole flow.
       The only content animation is the step-4 tick, floored at .8. */
    .sweep{animation:hiw-sweep 10s ease-in-out infinite}
    .s2{animation-delay:-2s}
    .s3{animation-delay:-4s}
    .s4{animation-delay:-6s}
    .s5{animation-delay:-8s}
    .tick{animation:hiw-tick 10s ease-in-out infinite}
    @keyframes hiw-sweep{0%,40%,100%{opacity:0}20%{opacity:.06}}
    @keyframes hiw-tick{0%,100%{opacity:1}50%{opacity:.8}}
    @media (prefers-reduced-motion: reduce){.sweep{animation:none}.tick{animation:none;opacity:1}}
  </style>

  <rect x="2" y="2" width="896" height="716" rx="24" fill="url(#hiw-bg)" stroke="#33215C" stroke-width="2.5"/>
  <g clip-path="url(#hiw-clip)">
    <rect x="2" y="2" width="896" height="716" fill="url(#hiw-glow)"/>
    <rect x="2" y="2" width="896" height="716" fill="url(#hiw-dots)" opacity="0.5"/>
  </g>

  <!-- header -->
  <text class="sans" font-size="28" font-weight="700" letter-spacing="4" x="40" y="44" fill="#CFC4E8">HOW IT WORKS</text>
  <text class="sans" font-size="28" font-weight="700" letter-spacing="4" x="860" y="44" text-anchor="end" fill="#CFC4E8" opacity="0.8">FIVE STEPS, ONE RUN</text>
  <line x1="40" y1="64" x2="860" y2="64" stroke="#CFC4E8" stroke-width="1.5" opacity="0.22"/>

  <!-- the sweep bands: decoration only, peak .06, drawn under everything -->
  <rect class="sweep" x="40" y="96" width="820" height="108" rx="8" fill="#A855F7" opacity="0"/>
  <rect class="sweep s2" x="40" y="216" width="820" height="108" rx="8" fill="#A855F7" opacity="0"/>
  <rect class="sweep s3" x="40" y="336" width="820" height="108" rx="8" fill="#A855F7" opacity="0"/>
  <rect class="sweep s4" x="40" y="456" width="820" height="108" rx="8" fill="#A855F7" opacity="0"/>
  <rect class="sweep s5" x="40" y="576" width="820" height="108" rx="8" fill="#A855F7" opacity="0"/>

  <!-- risers: the SOLID warm rail carries the brief down steps 1-3; the DASHED cool rail
       carries the condition from step 3 down to step 5. They overlap at step 3's left edge,
       and that overlap is the hand-off. -->
  <path d="M52 96 V210 H84 V330 H116 V404" fill="none" stroke="#F0916A" stroke-width="4"/>
  <path d="M116 376 V450 H148 V570 H180 V684" fill="none" stroke="#C4A6FF" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="116" cy="390" r="24" fill="none" stroke="#CFC4E8" stroke-width="1.5" opacity="0.3"/>

  <!-- carried chips: warm = the brief (sharp), cool = the condition (capsule). Static at every step. -->
  <rect x="38" y="136" width="28" height="28" fill="#F0916A"/>
  <rect x="70" y="256" width="28" height="28" fill="#F0916A"/>
  <rect x="102" y="376" width="28" height="28" rx="14" fill="#C4A6FF"/>
  <rect x="134" y="496" width="28" height="28" rx="14" fill="#C4A6FF"/>
  <rect x="166" y="616" width="28" height="28" rx="14" fill="#C4A6FF"/>

  <!-- 1 — prep while the context is still hot -->
  <text class="sans" font-size="44" font-weight="800" x="104" y="148" fill="#A855F7">1</text>
  <text class="mono" font-size="32" font-weight="700" x="148" y="148" fill="#F4F0FF">/goalify</text>
  <text class="sans" font-size="28" x="148" y="188" fill="#CFC4E8">prep while the context is still hot</text>
  <text class="sans" font-size="28" x="860" y="150" text-anchor="end" fill="#CFC4E8">context 90%</text>
  <rect x="700" y="166" width="160" height="12" rx="6" fill="#33215C"/>
  <rect x="700" y="166" width="144" height="12" rx="6" fill="#F0916A"/>

  <!-- 2 — a fresh session -->
  <text class="sans" font-size="44" font-weight="800" x="136" y="268" fill="#A855F7">2</text>
  <text class="mono" font-size="32" font-weight="700" x="180" y="268" fill="#F4F0FF">/clear</text>
  <rect x="314" y="246" width="12" height="30" fill="#CFC4E8" opacity="0.5"/>
  <text class="sans" font-size="28" x="180" y="308" fill="#CFC4E8">a fresh session, full context again</text>

  <!-- 3 — the hand-off row: the brief's rail ends here, the condition's rail begins -->
  <text class="sans" font-size="44" font-weight="800" x="168" y="388" fill="#A855F7">3</text>
  <text class="sans" font-size="32" font-weight="700" x="212" y="388" fill="#F4F0FF">paste the condition into</text>
  <rect x="610" y="362" width="108" height="38" rx="8" fill="#150A28" stroke="#33215C" stroke-width="2"/>
  <text class="mono" font-size="28" font-weight="700" x="664" y="388" text-anchor="middle" fill="#C4A6FF">/goal</text>
  <text class="sans" font-size="28" x="212" y="428" fill="#CFC4E8">the string, not the path</text>

  <!-- 4 — the closing turn. Sole success-colour moment in this asset. -->
  <text class="sans" font-size="44" font-weight="800" x="200" y="508" fill="#A855F7">4</text>
  <path class="tick" d="M166 508 L174 516 L190 496" fill="none" stroke="#34F5C5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sans" font-size="32" font-weight="700" x="244" y="508" fill="#F4F0FF">the closing turn reruns every check</text>
  <text class="sans" font-size="28" x="244" y="548" fill="#CFC4E8">quotes <tspan font-weight="600" fill="#F4F0FF">npm test</tspan>, says <tspan font-weight="600" fill="#F4F0FF">ASYNC-OK</tspan></text>

  <!-- 5 — the brief comes to rest -->
  <text class="sans" font-size="44" font-weight="800" x="232" y="628" fill="#A855F7">5</text>
  <text class="sans" font-size="32" font-weight="700" x="276" y="628" fill="#F4F0FF">the brief archives itself</text>
  <text class="mono" font-size="28" x="276" y="668" fill="#CFC4E8">.goal/done/</text>
  <rect x="784" y="594" width="72" height="72" rx="4" fill="#150A28" stroke="#33215C" stroke-width="2"/>
  <rect x="806" y="616" width="28" height="28" fill="#F0916A"/>
</svg>
