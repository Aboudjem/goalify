<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" fill="none" role="img" aria-label="How goalify works: five steps, and which artifact carries each one.">
  <title>How goalify works: five steps, and which artifact carries each one</title>
  <desc>Five steps, read top to bottom. Two rails run down the left edge and their lengths are the point. The solid indigo brief rail runs the full height, from step 1 to step 5, because the brief exists for the whole run: it is written in step 1, named by the condition in step 3, worked from during step 4, and filed in step 5. The dashed violet condition rail runs beside it from step 3 to step 4 only, because the condition exists from the moment you paste it until the closing turn proves it, and no longer. Step 1: goalify runs while the context is still hot, shown by a meter at ninety per cent. Step 2: clear the session, so the run starts with full context again. Step 3: paste the condition, the string rather than the path, into the command chip. Step 4: the closing turn reruns every check and quotes npm test, saying ASYNC-OK. Step 5: the brief archives itself into the done folder; its chip and the square resting in the archive box are indigo, the brief's colour, because it is the brief that comes to rest.</desc>
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="g-bloom" cx="0.5" cy="1" r="0.72">
      <stop offset="0%"  stop-color="#C77DFF" stop-opacity="0.18"/>
      <stop offset="42%" stop-color="#7C3AED" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="g-rule" gradientUnits="userSpaceOnUse" x1="48" y1="88" x2="852" y2="88">
      <stop offset="0%"   stop-color="#8E7BFF" stop-opacity="0.15"/>
      <stop offset="26%"  stop-color="#8E7BFF" stop-opacity="0.75"/>
      <stop offset="66%"  stop-color="#C77DFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="g-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .num  { font-size: 44px; font-weight: 800; }
    .step { font-size: 32px; font-weight: 700; }
    .body { font-size: 28px; font-weight: 500; }

    @keyframes g-breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: g-breathe 9s ease-in-out infinite; }

    @keyframes g-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: g-flow 14s linear infinite; }

    @keyframes g-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .row-1 { animation: g-rise 0.6s ease-out 0.3s both; }
    .row-2 { animation: g-rise 0.6s ease-out 0.8s both; }
    .row-3 { animation: g-rise 0.6s ease-out 1.3s both; }
    .row-4 { animation: g-rise 0.6s ease-out 1.8s both; }
    .row-5 { animation: g-rise 0.6s ease-out 2.3s both; }

    @keyframes g-pip { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .d1 { animation: g-pip 5s ease-in-out infinite 0s; }
    .d2 { animation: g-pip 5s ease-in-out infinite 0.35s; }
    .d3 { animation: g-pip 5s ease-in-out infinite 0.7s; }
    .d4 { animation: g-pip 5s ease-in-out infinite 1.05s; }
    .d5 { animation: g-pip 5s ease-in-out infinite 1.4s; }

    @keyframes g-tick { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
    .tick { animation: g-tick 10s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="900" height="760" fill="url(#g-bg)"/>
  <ellipse class="bloom" cx="450" cy="772" rx="600" ry="240" fill="url(#g-bloom)"/>
  <rect x="2" y="2" width="896" height="756" rx="24" fill="none" stroke="#1E2A42" stroke-width="1.5"/>

  <!-- header -->
  <text class="disp" font-size="40" font-weight="700" x="48" y="60" fill="#F2F6FF">How it works</text>
  <text class="mono" font-size="22" letter-spacing="2.5" x="852" y="60" text-anchor="end" fill="#8494B0">FIVE STEPS, ONE RUN</text>
  <line x1="48" y1="88" x2="852" y2="88" stroke="url(#g-rule)" stroke-width="1.5"/>
  <line class="flowline" x1="48" y1="88" x2="852" y2="88" stroke="url(#g-rule)" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.8"/>

  <!-- the two rails, with honest lifetimes: the brief exists for the whole run;
       the condition exists only from paste (step 3) to proof (step 4) -->
  <line x1="56" y1="132" x2="56" y2="700" stroke="#8E7BFF" stroke-width="4"/>
  <line x1="88" y1="380" x2="88" y2="560" stroke="#C77DFF" stroke-width="4" stroke-dasharray="12 8"/>
  <line class="flowline" x1="88" y1="380" x2="88" y2="560" stroke="#C77DFF" stroke-width="4" stroke-dasharray="12 8" opacity="0.8"/>

  <!-- 1, prep while the context is still hot -->
  <g class="row-1">
    <rect class="d1" x="42" y="150" width="28" height="28" fill="#8E7BFF" filter="url(#g-glow-sm)"/>
    <text class="disp num"  x="128" y="172" fill="#F2F6FF">1</text>
    <text class="mono" font-size="32" font-weight="700" x="180" y="172" fill="#C77DFF">/goalify</text>
    <text class="disp body" x="180" y="212" fill="#B6C2DA">prepare while the context is still hot</text>
    <text class="disp body" x="852" y="172" text-anchor="end" fill="#B6C2DA">context 90%</text>
    <rect x="692" y="188" width="160" height="12" rx="6" fill="#1E2A42"/>
    <rect x="692" y="188" width="144" height="12" rx="6" fill="#8E7BFF"/>
  </g>

  <!-- 2, a fresh session -->
  <g class="row-2">
    <rect class="d2" x="42" y="274" width="28" height="28" fill="#8E7BFF" filter="url(#g-glow-sm)"/>
    <text class="disp num"  x="128" y="296" fill="#F2F6FF">2</text>
    <text class="mono" font-size="32" font-weight="700" x="180" y="296" fill="#C77DFF">/clear</text>
    <text class="disp body" x="180" y="336" fill="#B6C2DA">a fresh session, full context again</text>
  </g>

  <!-- 3, the hand-off: the condition rail begins here -->
  <g class="row-3">
    <rect class="d3" x="74" y="398" width="28" height="28" rx="14" fill="#C77DFF" filter="url(#g-glow-sm)"/>
    <text class="disp num"  x="128" y="420" fill="#F2F6FF">3</text>
    <text class="disp step" x="180" y="420" fill="#F2F6FF">paste the condition into</text>
    <rect x="612" y="394" width="112" height="40" rx="10" fill="#141C2E" stroke="#1E2A42" stroke-width="1.5"/>
    <text class="mono" font-size="28" font-weight="700" x="668" y="422" text-anchor="middle" fill="#F2F6FF">/goal</text>
    <text class="disp body" x="180" y="460" fill="#B6C2DA">the string, not the path</text>
  </g>

  <!-- 4, the closing turn. Sole proof-colour moment in this asset. -->
  <g class="row-4">
    <rect class="d4" x="74" y="522" width="28" height="28" rx="14" fill="#C77DFF" filter="url(#g-glow-sm)"/>
    <text class="disp num"  x="128" y="544" fill="#F2F6FF">4</text>
    <text class="disp step" x="180" y="544" fill="#F2F6FF">the closing turn reruns every check</text>
    <text class="disp body" x="180" y="584" fill="#B6C2DA">quotes <tspan class="mono" font-weight="600" fill="#F2F6FF">npm test</tspan>, says <tspan class="mono" font-weight="600" fill="#F2F6FF">ASYNC-OK</tspan></text>
    <path class="tick" d="M800 540 L814 554 L840 524" fill="none" stroke="#3DFFAB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 5, the brief comes to rest: brief colour, brief shape -->
  <g class="row-5">
    <rect class="d5" x="42" y="646" width="28" height="28" fill="#8E7BFF" filter="url(#g-glow-sm)"/>
    <text class="disp num"  x="128" y="668" fill="#F2F6FF">5</text>
    <text class="disp step" x="180" y="668" fill="#F2F6FF">the brief archives itself</text>
    <text class="mono" font-size="28" x="180" y="708" fill="#B6C2DA">.goal/done/</text>
    <rect x="780" y="636" width="72" height="72" rx="4" fill="#0E1524" stroke="#1E2A42" stroke-width="1.5"/>
    <rect x="802" y="658" width="28" height="28" fill="#8E7BFF"/>
  </g>
</svg>
