<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img"
     aria-label="goalify: writes the brief and the condition">
  <title>goalify</title>
  <defs>
    <linearGradient id="ld-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="58%" stop-color="#07060f"/>
      <stop offset="100%" stop-color="#060510"/>
    </linearGradient>
    <radialGradient id="ld-ba" cx="0.15" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ld-bb" cx="0.88" cy="0.85" r="0.48">
      <stop offset="0%" stop-color="#2ee6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ld-ink" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="110" y2="110">
      <stop class="ldi1" offset="0%"   stop-color="#9b6bff"/>
      <stop class="ldi2" offset="52%"  stop-color="#6fa8ff"/>
      <stop class="ldi3" offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <linearGradient id="ld-word" x1="0" y1="0" x2="1" y2="0.2">
      <stop class="ldw1" offset="0%"   stop-color="#9b6bff"/>
      <stop class="ldw2" offset="50%"  stop-color="#7c9dff"/>
      <stop class="ldw3" offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <linearGradient id="ld-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ld-wclip">
      <text x="140" y="116"
            font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
            font-size="68" font-weight="800" letter-spacing="-2.2">goalify</text>
    </clipPath>
    <filter id="ld-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ld-glow-sm" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ld-frame"><rect width="720" height="200"/></clipPath>
  </defs>

  <style>
    .ld-disp { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .ld-mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }

    @keyframes ldi1 { 0%,100% { stop-color:#9b6bff; } 50% { stop-color:#b892ff; } }
    @keyframes ldi2 { 0%,100% { stop-color:#6fa8ff; } 50% { stop-color:#9b6bff; } }
    @keyframes ldi3 { 0%,100% { stop-color:#2ee6ff; } 50% { stop-color:#6fa8ff; } }
    .ldi1 { animation: ldi1 14s ease-in-out infinite; }
    .ldi2 { animation: ldi2 14s ease-in-out infinite 1.5s; }
    .ldi3 { animation: ldi3 14s ease-in-out infinite 3s; }

    @keyframes ldw1 { 0%,100% { stop-color:#9b6bff; } 50% { stop-color:#2ee6ff; } }
    @keyframes ldw2 { 0%,100% { stop-color:#7c9dff; } 50% { stop-color:#9b6bff; } }
    @keyframes ldw3 { 0%,100% { stop-color:#2ee6ff; } 50% { stop-color:#ff3d9a; } }
    .ldw1 { animation: ldw1 16s ease-in-out infinite; }
    .ldw2 { animation: ldw2 16s ease-in-out infinite 2s; }
    .ldw3 { animation: ldw3 16s ease-in-out infinite 4s; }

    @keyframes ld-breathe { 0%,100% { opacity:.65; } 50% { opacity:1; } }
    .ld-bloom { animation: ld-breathe 9s ease-in-out infinite; }

    @keyframes ld-ring { 0%,100% { opacity:.5; } 40%,60% { opacity:1; } }
    .ld-rl { animation: ld-ring 6s ease-in-out infinite; }

    @keyframes ld-fly {
      0% { transform: translate(36px,-36px); opacity:0; }
      10% { opacity:1; }
      35%,100% { transform: translate(0,0); opacity:1; }
    }
    .ld-pin { animation: ld-fly 6s cubic-bezier(.18,.72,.28,1) infinite; }

    @keyframes ld-pulse {
      0%,35% { r: 16px; opacity:0; }
      42% { opacity:.6; }
      75%,100% { r: 52px; opacity:0; }
    }
    .ld-pulse { animation: ld-pulse 6s cubic-bezier(.2,.6,.3,1) infinite; }

    @keyframes ld-check { 0%,30% { opacity:0; } 45%,100% { opacity:1; } }
    .ld-check { animation: ld-check 6s ease-in-out infinite; }

    @keyframes ld-sheen { 0% { transform: translateX(-20px); } 18%,100% { transform: translateX(440px); } }
    .ld-sheen { animation: ld-sheen 8.5s cubic-bezier(.4,0,.3,1) infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="720" height="200" fill="url(#ld-bg)"/>
  <g class="ld-bloom">
    <rect width="720" height="200" fill="url(#ld-ba)"/>
    <rect width="720" height="200" fill="url(#ld-bb)"/>
  </g>

  <!-- Mark: translate to center at ~(68,100), scale = 68/128 = 0.531 -->
  <g transform="translate(68,100) scale(0.531)">
    <g fill="none" stroke="url(#ld-ink)" stroke-width="9" opacity="0.22">
      <circle cx="0" cy="0" r="26"/>
      <circle cx="0" cy="0" r="50"/>
      <circle cx="0" cy="0" r="74"/>
    </g>
    <g class="ld-rl" fill="none" stroke="url(#ld-ink)" stroke-width="9" filter="url(#ld-glow)">
      <circle cx="0" cy="0" r="26"/>
      <circle cx="0" cy="0" r="50"/>
      <circle cx="0" cy="0" r="74"/>
    </g>
    <circle class="ld-pulse" cx="0" cy="0" r="16" fill="none"
            stroke="#9b6bff" stroke-width="3" opacity="0"/>
    <g class="ld-pin">
      <g filter="url(#ld-glow)">
        <line x1="68" y1="-68" x2="0" y2="0"
              stroke="url(#ld-ink)" stroke-width="12" stroke-linecap="round"/>
      </g>
      <g filter="url(#ld-glow-sm)">
        <circle r="9" fill="#07060f"/>
        <path class="ld-check" d="M-4 1 L-0.5 4.5 L6 -3.5"
              stroke="#3dffa8" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <g filter="url(#ld-glow)">
    <text class="ld-disp" x="140" y="116" font-size="68" font-weight="800"
          letter-spacing="-2.2" fill="url(#ld-word)">goalify</text>
  </g>
  <g clip-path="url(#ld-wclip)">
    <g transform="skewX(-18)">
      <rect class="ld-sheen" x="86" y="46" width="28" height="84"
            fill="url(#ld-sheen)" opacity="0.4"/>
    </g>
  </g>

  <!-- Tagline -->
  <text class="ld-mono" x="140" y="148" font-size="11.5" letter-spacing="1.6"
        fill="#a59cc9">writes the brief and the condition</text>
</svg>
