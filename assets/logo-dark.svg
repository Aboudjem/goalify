<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="goalify: writes the brief and the condition">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="g-bloom" cx="0.5" cy="1" r="0.78">
      <stop offset="0%"  stop-color="#FF2D78" stop-opacity="0.26"/>
      <stop offset="38%" stop-color="#7C3AED" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="g-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD59A"/>
      <stop offset="30%"  stop-color="#FFB341"/>
      <stop offset="66%"  stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#8E7BFF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="g-horizonline" gradientUnits="userSpaceOnUse" x1="40" y1="170" x2="680" y2="170">
      <stop offset="0%"   stop-color="#8E7BFF" stop-opacity="0"/>
      <stop offset="24%"  stop-color="#8E7BFF" stop-opacity="0.5"/>
      <stop offset="58%"  stop-color="#C77DFF" stop-opacity="0.8"/>
      <stop offset="84%"  stop-color="#FF4D8D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="g-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="200">
      <stop offset="0%"   stop-color="#8E7BFF" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="#C77DFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="g-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="g-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="g-sunglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="g-sunclip">
      <circle cx="636" cy="136" r="34"/>
    </clipPath>

    <clipPath id="g-gridclip">
      <rect x="0" y="170" width="720" height="30"/>
    </clipPath>

    <clipPath id="g-wordclip">
      <text x="124" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="62" font-weight="800" letter-spacing="-1.8">goalify</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .tag  { font-size: 13.5px; letter-spacing: 1.6px; fill: #8494B0; }

    @keyframes g-breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: g-breathe 9s ease-in-out infinite; }

    @keyframes g-sunpulse { 0%,100% { opacity: 0.42; } 50% { opacity: 0.62; } }
    .sun { animation: g-sunpulse 10s ease-in-out infinite; }

    @keyframes g-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: g-flow 14s linear infinite; }

    @keyframes g-sheen {
      0%   { transform: translateX(0); }
      34%  { transform: translateX(480px); }
      100% { transform: translateX(480px); }
    }
    .sheen { animation: g-sheen 7.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="200" fill="url(#g-bg)"/>
  <ellipse class="bloom" cx="360" cy="204" rx="440" ry="120" fill="url(#g-bloom)"/>

  <!-- sun disc, small, on the horizon at the right edge -->
  <g class="sun">
    <g filter="url(#g-sunglow)">
      <circle cx="636" cy="136" r="34" fill="url(#g-sun)"/>
    </g>
    <g clip-path="url(#g-sunclip)" fill="#080C16">
      <rect x="596" y="141" width="80" height="2"/>
      <rect x="596" y="147" width="80" height="2.6"/>
      <rect x="596" y="154" width="80" height="3.4"/>
      <rect x="596" y="162.5" width="80" height="4.6"/>
    </g>
  </g>

  <!-- perspective grid below the horizon, shipped off; flip this opacity to 1 to see it -->
  <g id="grid" clip-path="url(#g-gridclip)" opacity="0">
    <g stroke="url(#g-gridfade)" stroke-width="1" fill="none">
      <path d="M360 170 L-620 200"/><path d="M360 170 L-180 200"/><path d="M360 170 L40 200"/>
      <path d="M360 170 L180 200"/> <path d="M360 170 L280 200"/>  <path d="M360 170 L360 200"/>
      <path d="M360 170 L440 200"/> <path d="M360 170 L540 200"/>  <path d="M360 170 L680 200"/>
      <path d="M360 170 L900 200"/> <path d="M360 170 L1340 200"/>
    </g>
    <g stroke="url(#g-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="172"   x2="720" y2="172"/>
      <line x1="0" y1="175"   x2="720" y2="175"/>
      <line x1="0" y1="179.5" x2="720" y2="179.5"/>
      <line x1="0" y1="186"   x2="720" y2="186"/>
      <line x1="0" y1="195"   x2="720" y2="195"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="40" y1="170" x2="680" y2="170" stroke="url(#g-horizonline)" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="170" x2="680" y2="170" stroke="url(#g-horizonline)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <!-- mark: concentric target, one pin through the centre -->
  <g filter="url(#g-glow)">
    <g fill="none" stroke="url(#g-brand)" stroke-width="2.8">
      <circle cx="72" cy="88" r="30"/>
      <circle cx="72" cy="88" r="19.5" stroke-width="2.4" opacity="0.82"/>
      <circle cx="72" cy="88" r="9" stroke-width="2.2" opacity="0.66"/>
    </g>
    <line x1="40" y1="56" x2="93" y2="109" stroke="#C77DFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="36" cy="52" r="4.8" fill="#C77DFF"/>
    <circle cx="72" cy="88" r="3.4" fill="#F2F6FF"/>
  </g>

  <text class="disp" x="124" y="104" font-size="62" font-weight="800" letter-spacing="-1.8" fill="url(#g-brand)">goalify</text>

  <g clip-path="url(#g-wordclip)">
    <g transform="skewX(-18)">
      <rect class="sheen" x="-130" y="42" width="76" height="110" fill="url(#g-sheen)" opacity="0.7"/>
    </g>
  </g>

  <text class="mono tag" x="126" y="140">writes the brief and the condition</text>
</svg>
