<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img"
     aria-label="goalify: a pin flies into the centre of the target and the rings pulse once">
  <title>goalify</title>
  <defs>
    <linearGradient id="go-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#14102A"/>
      <stop offset="55%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>
    <radialGradient id="go-bloomA" cx="0.15" cy="0.13" r="0.44">
      <stop offset="0%" stop-color="#8E7BFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="go-bloomB" cx="0.88" cy="0.85" r="0.50">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="go-bloomC" cx="0.52" cy="0.04" r="0.36">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="go-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#B4A6FF" stop-opacity="0.20"/>
      <stop offset="42%"  stop-color="#C77DFF" stop-opacity="0.124"/>
      <stop offset="76%"  stop-color="#FF4D8D" stop-opacity="0.046"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="go-frame"><rect width="720" height="200"/></clipPath>
    <linearGradient id="go-ink" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="200" y2="200">
      <stop class="gok1" offset="0%"   stop-color="#8E7BFF"/>
      <stop class="gok2" offset="52%"  stop-color="#A78CFF"/>
      <stop class="gok3" offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
    <filter id="go-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="go-glow-sm" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="go-word" x1="0" y1="0" x2="1" y2="0.25">
      <stop class="gok1" offset="0%"   stop-color="#8E7BFF"/>
      <stop class="gok2" offset="46%"  stop-color="#A78CFF"/>
      <stop class="gok3" offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
    <linearGradient id="go-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="go-wordclip">
      <text x="140" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="62" font-weight="800" letter-spacing="-1.9">goalify</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #B4A6FF; }
    .head    { font-size: 22px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.5px; }
    .sub     { font-size: 16.5px; font-weight: 500; fill: #C2CDE4; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #93A2BE; }
    .chip    { font-size: 11.5px; letter-spacing: 1.2px; fill: #C2CDE4; }
    @keyframes go-breathe { 0%,100% { opacity:0.62; } 50% { opacity:1; } }
    .gobloom { animation: go-breathe 11s ease-in-out infinite; }
    @keyframes go-sweep { 0% { transform: translateX(-360px); } 100% { transform: translateX(1080px); } }
    .gowash { animation: go-sweep 15s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes go-sheen { 0% { transform: translateX(0); } 15%,100% { transform: translateX(285px); } }
    .gosheen { animation: go-sheen 8.5s cubic-bezier(.4,0,.3,1) infinite; }
    @keyframes go-fly { 0% { transform: translate(56px,-56px); opacity: 0; }
                       10% { opacity: 1; }
                       34%,100% { transform: translate(0,0); opacity: 1; } }
    .gopin { animation: go-fly 6s cubic-bezier(.2,.7,.3,1) infinite; }
    /* the pulse ring is the one element whose base state is off: it is a transient, not
       part of the logo, so the resting frame shows the target and the pin alone */
    @keyframes go-pulse { 0%,34% { r: 26px; opacity: 0; } 40% { opacity: 0.7; }
                         74%,100% { r: 88px; opacity: 0; } }
    .gopulse { animation: go-pulse 6s cubic-bezier(.2,.6,.3,1) infinite; }
    @keyframes go-ringlight { 0%,100% { opacity: 0.55; } 40%,60% { opacity: 1; } }
    .gorl { animation: go-ringlight 6s ease-in-out infinite; }
    @keyframes go-k1 { 0%,100% { stop-color:#8E7BFF; } 50% { stop-color:#A78CFF; } }
    @keyframes go-k2 { 0%,100% { stop-color:#A78CFF; } 50% { stop-color:#C77DFF; } }
    @keyframes go-k3 { 0%,100% { stop-color:#C77DFF; } 50% { stop-color:#E0AEFF; } }
    .gok1 { animation: go-k1 14s ease-in-out infinite; }
    .gok2 { animation: go-k2 14s ease-in-out infinite; }
    .gok3 { animation: go-k3 14s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="720" height="200" fill="url(#go-ground)"/>
  <g class="gobloom">
    <rect width="720" height="200" fill="url(#go-bloomA)"/>
    <rect width="720" height="200" fill="url(#go-bloomB)"/>
    <rect width="720" height="200" fill="url(#go-bloomC)"/>
  </g>
  <g clip-path="url(#go-frame)">
    <g transform="translate(0,100)">
      <ellipse class="gowash" cx="0" cy="0" rx="300" ry="180" fill="url(#go-wash)"/>
    </g>
  </g>
  <g transform="translate(30,50) scale(0.3906)">
  <g opacity="0.32" fill="none" stroke="url(#go-ink)" stroke-width="9"><circle cx="128" cy="128" r="26"/><circle cx="128" cy="128" r="50"/><circle cx="128" cy="128" r="74"/></g>
  <g class="gorl" filter="url(#go-glow)" fill="none" stroke="url(#go-ink)" stroke-width="9"><circle cx="128" cy="128" r="26"/><circle cx="128" cy="128" r="50"/><circle cx="128" cy="128" r="74"/></g>
  <circle class="gopulse" cx="128" cy="128" r="26" fill="none"
          stroke="#C77DFF" stroke-width="4" opacity="0"/>
  <g class="gopin">
    <g filter="url(#go-glow)">
      <line x1="196" y1="60" x2="128" y2="128" stroke="url(#go-ink)"
            stroke-width="13" stroke-linecap="round"/>
    </g>
    <g transform="translate(128,128)"><g filter="url(#go-glow-sm)"><circle r="7" fill="#FFFFFF"/></g></g>
  </g>
  </g>
  <g filter="url(#go-glow)">
    <text class="disp" x="140" y="108" font-size="62" font-weight="800"
          letter-spacing="-1.9" fill="url(#go-word)">goalify</text>
  </g>
  <g clip-path="url(#go-wordclip)">
    <g transform="skewX(-18)">
      <rect class="gosheen" x="72" y="46" width="29"
            height="84" fill="url(#go-sheen)" opacity="0.45"/>
    </g>
  </g>
  <text class="mono tag" x="140" y="142">writes the brief and the condition</text>
</svg>
