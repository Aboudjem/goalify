<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img"
     aria-label="goalify: writes the brief and the condition">
  <title>goalify</title>
  <defs>
    <linearGradient id="ll-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f7f5ff"/>
      <stop offset="100%" stop-color="#ede9ff"/>
    </linearGradient>
    <radialGradient id="ll-ba" cx="0.15" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#7b47e8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7b47e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ll-bb" cx="0.88" cy="0.85" r="0.48">
      <stop offset="0%" stop-color="#00c4e0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00c4e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ll-ink" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="110" y2="110">
      <stop class="lli1" offset="0%"   stop-color="#7b47e8"/>
      <stop class="lli2" offset="52%"  stop-color="#5470d4"/>
      <stop class="lli3" offset="100%" stop-color="#00c4e0"/>
    </linearGradient>
    <linearGradient id="ll-word" x1="0" y1="0" x2="1" y2="0.2">
      <stop class="llw1" offset="0%"   stop-color="#7b47e8"/>
      <stop class="llw2" offset="50%"  stop-color="#4d6cd4"/>
      <stop class="llw3" offset="100%" stop-color="#00c4e0"/>
    </linearGradient>
    <filter id="ll-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ll-glow-sm" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .ll-disp { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .ll-mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }

    @keyframes lli1 { 0%,100% { stop-color:#7b47e8; } 50% { stop-color:#9b6bff; } }
    @keyframes lli2 { 0%,100% { stop-color:#5470d4; } 50% { stop-color:#7b47e8; } }
    @keyframes lli3 { 0%,100% { stop-color:#00c4e0; } 50% { stop-color:#5470d4; } }
    .lli1 { animation: lli1 14s ease-in-out infinite; }
    .lli2 { animation: lli2 14s ease-in-out infinite 1.5s; }
    .lli3 { animation: lli3 14s ease-in-out infinite 3s; }

    @keyframes llw1 { 0%,100% { stop-color:#7b47e8; } 50% { stop-color:#00c4e0; } }
    @keyframes llw2 { 0%,100% { stop-color:#4d6cd4; } 50% { stop-color:#7b47e8; } }
    @keyframes llw3 { 0%,100% { stop-color:#00c4e0; } 50% { stop-color:#e0006b; } }
    .llw1 { animation: llw1 16s ease-in-out infinite; }
    .llw2 { animation: llw2 16s ease-in-out infinite 2s; }
    .llw3 { animation: llw3 16s ease-in-out infinite 4s; }

    @keyframes ll-breathe { 0%,100% { opacity:.70; } 50% { opacity:1; } }
    .ll-bloom { animation: ll-breathe 9s ease-in-out infinite; }

    @keyframes ll-ring { 0%,100% { opacity:.55; } 40%,60% { opacity:1; } }
    .ll-rl { animation: ll-ring 6s ease-in-out infinite; }

    @keyframes ll-fly {
      0% { transform: translate(36px,-36px); opacity:0; }
      10% { opacity:1; }
      35%,100% { transform: translate(0,0); opacity:1; }
    }
    .ll-pin { animation: ll-fly 6s cubic-bezier(.18,.72,.28,1) infinite; }

    @keyframes ll-pulse {
      0%,35% { r: 16px; opacity:0; }
      42% { opacity:.5; }
      75%,100% { r: 52px; opacity:0; }
    }
    .ll-pulse { animation: ll-pulse 6s cubic-bezier(.2,.6,.3,1) infinite; }

    @keyframes ll-check { 0%,30% { opacity:0; } 45%,100% { opacity:1; } }
    .ll-check { animation: ll-check 6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="720" height="200" fill="url(#ll-bg)"/>
  <g class="ll-bloom">
    <rect width="720" height="200" fill="url(#ll-ba)"/>
    <rect width="720" height="200" fill="url(#ll-bb)"/>
  </g>

  <g transform="translate(68,100) scale(0.531)">
    <g fill="none" stroke="url(#ll-ink)" stroke-width="9" opacity="0.26">
      <circle cx="0" cy="0" r="26"/>
      <circle cx="0" cy="0" r="50"/>
      <circle cx="0" cy="0" r="74"/>
    </g>
    <g class="ll-rl" fill="none" stroke="url(#ll-ink)" stroke-width="9" filter="url(#ll-glow)">
      <circle cx="0" cy="0" r="26"/>
      <circle cx="0" cy="0" r="50"/>
      <circle cx="0" cy="0" r="74"/>
    </g>
    <circle class="ll-pulse" cx="0" cy="0" r="16" fill="none"
            stroke="#7b47e8" stroke-width="3" opacity="0"/>
    <g class="ll-pin">
      <g filter="url(#ll-glow)">
        <line x1="68" y1="-68" x2="0" y2="0"
              stroke="url(#ll-ink)" stroke-width="12" stroke-linecap="round"/>
      </g>
      <g filter="url(#ll-glow-sm)">
        <circle r="9" fill="#f7f5ff"/>
        <path class="ll-check" d="M-4 1 L-0.5 4.5 L6 -3.5"
              stroke="#00a86b" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>

  <text class="ll-disp" x="140" y="116" font-size="68" font-weight="800"
        letter-spacing="-2.2" fill="url(#ll-word)">goalify</text>
  <text class="ll-mono" x="140" y="148" font-size="11.5" letter-spacing="1.6"
        fill="#5a4a7a">writes the brief and the condition</text>
</svg>
