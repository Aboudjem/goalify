<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img"
     aria-label="goalify logo mark: concentric rings with a pin arriving at centre">
  <title>goalify</title>
  <desc>Animated dark logo mark. Concentric rings pulse; a pin flies in and settles at the centre with a green check.</desc>
  <defs>
    <linearGradient id="gm-plate" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="58%" stop-color="#07060f"/>
      <stop offset="100%" stop-color="#060510"/>
    </linearGradient>
    <radialGradient id="gm-ba" cx="0.22" cy="0.22" r="0.72">
      <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gm-bb" cx="0.82" cy="0.82" r="0.64">
      <stop offset="0%" stop-color="#2ee6ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gm-ink" gradientUnits="userSpaceOnUse" x1="54" y1="54" x2="202" y2="202">
      <stop class="gi1" offset="0%"   stop-color="#9b6bff"/>
      <stop class="gi2" offset="52%"  stop-color="#6fa8ff"/>
      <stop class="gi3" offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <filter id="gm-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gm-glow-sm" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes gi1 { 0%,100% { stop-color:#9b6bff; } 50% { stop-color:#b892ff; } }
    @keyframes gi2 { 0%,100% { stop-color:#6fa8ff; } 50% { stop-color:#9b6bff; } }
    @keyframes gi3 { 0%,100% { stop-color:#2ee6ff; } 50% { stop-color:#6fa8ff; } }
    .gi1 { animation: gi1 14s ease-in-out infinite; }
    .gi2 { animation: gi2 14s ease-in-out infinite 1.5s; }
    .gi3 { animation: gi3 14s ease-in-out infinite 3s; }

    @keyframes gm-breathe { 0%,100% { opacity:.65; } 50% { opacity:1; } }
    .gm-bloom { animation: gm-breathe 9s ease-in-out infinite; }

    @keyframes gm-ring { 0%,100% { opacity:.5; } 40%,60% { opacity:1; } }
    .gm-ring-lit { animation: gm-ring 6s ease-in-out infinite; }

    @keyframes gm-fly {
      0% { transform: translate(54px,-54px); opacity:0; }
      10% { opacity:1; }
      35%,100% { transform: translate(0,0); opacity:1; }
    }
    .gm-pin { animation: gm-fly 6s cubic-bezier(.18,.72,.28,1) infinite; }

    @keyframes gm-pulse {
      0%,35% { r: 26px; opacity:0; }
      42% { opacity:.6; }
      75%,100% { r: 82px; opacity:0; }
    }
    .gm-pulse { animation: gm-pulse 6s cubic-bezier(.2,.6,.3,1) infinite; }

    @keyframes gm-check { 0%,30% { opacity:0; } 45%,100% { opacity:1; } }
    .gm-check { animation: gm-check 6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="256" height="256" rx="56" fill="url(#gm-plate)"/>
  <g class="gm-bloom">
    <rect width="256" height="256" rx="56" fill="url(#gm-ba)"/>
    <rect width="256" height="256" rx="56" fill="url(#gm-bb)"/>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="55.2" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <path d="M56 1.5 Q128 0.5 200 1.5" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="1"/>

  <g fill="none" stroke="url(#gm-ink)" stroke-width="8" opacity="0.22">
    <circle cx="128" cy="128" r="26"/>
    <circle cx="128" cy="128" r="50"/>
    <circle cx="128" cy="128" r="74"/>
  </g>
  <g class="gm-ring-lit" fill="none" stroke="url(#gm-ink)" stroke-width="8" filter="url(#gm-glow)">
    <circle cx="128" cy="128" r="26"/>
    <circle cx="128" cy="128" r="50"/>
    <circle cx="128" cy="128" r="74"/>
  </g>
  <circle class="gm-pulse" cx="128" cy="128" r="26" fill="none"
          stroke="#9b6bff" stroke-width="3" opacity="0"/>

  <g class="gm-pin">
    <g filter="url(#gm-glow)">
      <line x1="196" y1="60" x2="128" y2="128"
            stroke="url(#gm-ink)" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g transform="translate(128,128)" filter="url(#gm-glow-sm)">
      <circle r="11" fill="#07060f"/>
      <path class="gm-check" d="M-5 1.5 L-0.5 6 L8 -4.5"
            stroke="#3dffa8" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
