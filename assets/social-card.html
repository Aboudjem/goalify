<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>goalify social card</title>
<!--
  Source of .github/social-preview.png and assets/social-preview.png (1280x640).
  Render: chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1280,640 --screenshot=social-preview.png assets/social-card.html
  The receipt on the right is the real output of `make demo` (2026-11-17), trimmed.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #07060f;
    --purp:  #9b6bff;
    --lav:   #b9a3ff;
    --cyan:  #2ee6ff;
    --grn:   #3dffa8;
    --ink:   #f1edff;
    --sub:   #a59cc9;
    --dim:   #4a4468;
  }

  html, body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: var(--bg);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  body {
    position: relative;
    background:
      radial-gradient(ellipse 55% 60% at 12% 18%, rgba(155,107,255,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 50% 55% at 88% 85%, rgba(61,255,168,0.07) 0%, transparent 70%),
      var(--bg);
  }

  .left {
    position: absolute;
    left: 72px;
    top: 92px;
    width: 640px;
  }

  .logo-row { display: flex; align-items: center; gap: 16px; }
  .wordmark { font-size: 34px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }

  h1 {
    margin-top: 44px;
    font-size: 78px;
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -0.045em;
    color: var(--ink);
  }
  h1 .grad { color: var(--lav); }

  .sub {
    margin-top: 26px;
    font-size: 26px;
    line-height: 1.35;
    font-weight: 500;
    color: var(--sub);
  }

  .cmd {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 22px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.14);
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    font-size: 21px;
    color: var(--ink);
  }
  .cmd .k { color: var(--lav); }

  .card {
    position: absolute;
    right: 72px;
    top: 168px;
    width: 452px;
    padding: 30px 30px 34px;
    border-radius: 22px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(61,255,168,0.28);
  }
  .card .label {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(61,255,168,0.12);
    color: var(--grn);
    font-size: 16px;
    font-weight: 700;
  }
  .card .verdict {
    margin-top: 22px;
    font-size: 44px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--grn);
  }
  .card .count { margin-top: 8px; font-size: 20px; font-weight: 600; color: var(--ink); }
  .card pre {
    margin-top: 22px;
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--sub);
    white-space: pre-wrap;
  }
  .card pre .ok { color: var(--grn); }
  .card .bar { margin-top: 22px; height: 8px; border-radius: 4px; background: var(--grn); }
</style>
</head>
<body>
  <div class="left">
    <div class="logo-row">
      <svg width="48" height="48" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#a78cff" stroke-width="16" stroke-linecap="round"><circle cx="128" cy="128" r="26"/><circle cx="128" cy="128" r="56"/><circle cx="128" cy="128" r="86"/></g>
        <line x1="200" y1="56" x2="128" y2="128" stroke="#c77dff" stroke-width="20" stroke-linecap="round"/>
        <circle cx="128" cy="128" r="10" fill="#fff"/>
      </svg>
      <div class="wordmark">goalify</div>
    </div>
    <h1>Done should mean <span class="grad">the tests passed.</span></h1>
    <p class="sub">Plan the big job once. Get a receipt, not a promise.</p>
    <div class="cmd"><span class="k">/goalify</span> migrate the API client to async</div>
  </div>

  <div class="card">
    <span class="label">/goalify verify</span>
    <div class="verdict">VERIFIED</div>
    <div class="count">2/2 checks passed</div>
    <pre><span class="ok">PASS</span> python3 -m unittest -q test_slugify
<span class="ok">PASS</span> grep -n "TODO" slugify.py</pre>
    <div class="bar"></div>
  </div>
</body>
</html>
