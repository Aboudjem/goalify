<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none" role="img" aria-label="goalify v3 social preview: writes the brief and condition, you paste one line and Claude runs">
  <title>goalify: writes the brief and the condition. You paste one line. Claude runs.</title>
  <desc>Dark glass social card for goalify. Left side: animated logo mark and wordmark in purple to cyan gradient with tagline. Right side: two code blocks showing the /goalify command, the /goal paste, and proof output with ASYNC-OK and npm tests passing.</desc>
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#0d0b1a"/>
      <stop offset="55%"  stop-color="#07060f"/>
      <stop offset="100%" stop-color="#060510"/>
    </linearGradient>
    <radialGradient id="sp-gA" cx="0.10" cy="0.15" r="0.65">
      <stop offset="0%"   stop-color="#9b6bff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sp-gB" cx="0.92" cy="0.88" r="0.58">
      <stop offset="0%"   stop-color="#2ee6ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-brand" x1="0" y1="0" x2="1" y2="0.2">
      <stop class="sp-s1" offset="0%"   stop-color="#9b6bff"/>
      <stop class="sp-s2" offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <linearGradient id="sp-mark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0%"   stop-color="#9b6bff"/>
      <stop offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <linearGradient id="sp-divider" gradientUnits="userSpaceOnUse" x1="640" y1="80" x2="640" y2="560">
      <stop offset="0%"   stop-color="#9b6bff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#9b6bff" stop-opacity="0.55"/>
      <stop offset="80%"  stop-color="#2ee6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2ee6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sp-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sp-glow-sm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sp-clip">
      <rect width="1280" height="640" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .sp  { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .spm { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }

    @keyframes sp-s1 { 0%,100% { stop-color:#9b6bff; } 50% { stop-color:#2ee6ff; } }
    @keyframes sp-s2 { 0%,100% { stop-color:#2ee6ff; } 50% { stop-color:#ff3d9a; } }
    .sp-s1 { animation: sp-s1 16s ease-in-out infinite; }
    .sp-s2 { animation: sp-s2 16s ease-in-out infinite 2s; }

    @keyframes sp-bloom { 0%,100% { opacity:.65; } 50% { opacity:1; } }
    .sp-bloom { animation: sp-bloom 12s ease-in-out infinite; }

    @keyframes sp-rise { from { transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .sp-r1 { animation: sp-rise 0.6s ease-out 0.3s both; }
    .sp-r2 { animation: sp-rise 0.6s ease-out 0.8s both; }
    .sp-r3 { animation: sp-rise 0.6s ease-out 1.3s both; }

    @keyframes sp-rings { 0%,100% { opacity:.75; } 50% { opacity:1; } }
    .sp-rings { animation: sp-rings 9s ease-in-out infinite; }

    @keyframes sp-tick { 0%,100% { opacity:1; } 50% { opacity:.72; } }
    .sp-tick { animation: sp-tick 8s ease-in-out infinite; }

    @keyframes sp-tw { 0%,100% { opacity:.08; } 50% { opacity:.50; } }
    .sp-t1 { animation: sp-tw 7s ease-in-out infinite 0.5s; }
    .sp-t2 { animation: sp-tw 9s ease-in-out infinite 3s; }
    .sp-t3 { animation: sp-tw 8s ease-in-out infinite 5s; }

    /* Cross-flare star twinkle */
    @keyframes sp-flare { 0%,100% { opacity:.35; transform:scale(1); }
                          50%      { opacity:.70; transform:scale(1.4); } }
    .sp-flare { animation: sp-flare 9s ease-in-out infinite 1s; transform-origin: 1100px 72px; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#sp-clip)">
    <!-- Background -->
    <rect width="1280" height="640" fill="url(#sp-bg)"/>
    <g class="sp-bloom">
      <rect width="1280" height="640" fill="url(#sp-gA)"/>
      <rect width="1280" height="640" fill="url(#sp-gB)"/>
    </g>

    <!-- Border + top highlight -->
    <rect x="1.5" y="1.5" width="1277" height="637" rx="23"
          fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <rect x="2" y="2" width="1276" height="1.5" rx="0.75"
          fill="#ffffff" fill-opacity="0.16"/>

    <!-- Stars -->
    <circle class="sp-t1" cx="1180" cy="60"  r="1.2" fill="#ffffff"/>
    <circle class="sp-t2" cx="60"   cy="570" r="1.0" fill="#ffffff"/>
    <circle class="sp-t3" cx="900"  cy="580" r="1.0" fill="#ffffff"/>

    <!-- Cross-flare -->
    <g class="sp-flare">
      <line x1="1100" y1="62" x2="1100" y2="82"
            stroke="#2ee6ff" stroke-width="1.5" stroke-linecap="round" opacity="0.60"/>
      <line x1="1090" y1="72" x2="1110" y2="72"
            stroke="#2ee6ff" stroke-width="1.5" stroke-linecap="round" opacity="0.60"/>
    </g>

    <!-- Vertical divider at x=640 -->
    <line x1="640" y1="80" x2="640" y2="560"
          stroke="url(#sp-divider)" stroke-width="1.5"/>

    <!-- ═══════════════ LEFT SIDE ═══════════════ -->
    <g class="sp-r1">
      <!-- Animated mark -->
      <g class="sp-rings" filter="url(#sp-glow)" transform="translate(80,220) scale(0.58)">
        <circle cx="128" cy="128" r="100" stroke="url(#sp-mark)" stroke-width="8"/>
        <circle cx="128" cy="128" r="62"  stroke="url(#sp-mark)" stroke-width="7" opacity="0.82"/>
        <circle cx="128" cy="128" r="26"  stroke="url(#sp-mark)" stroke-width="6" opacity="0.64"/>
        <line x1="46"  y1="46"  x2="172" y2="172"
              stroke="#2ee6ff" stroke-width="8" stroke-linecap="round"/>
        <circle cx="40"  cy="40"  r="12" fill="#2ee6ff"/>
        <circle cx="128" cy="128" r="9"  fill="#3dffa8"/>
      </g>

      <!-- Wordmark -->
      <g filter="url(#sp-glow)">
        <text class="sp" x="170" y="270" font-size="114" font-weight="800"
              letter-spacing="-3.5" fill="url(#sp-brand)">goalify</text>
      </g>
    </g>

    <!-- Tagline -->
    <g class="sp-r2">
      <text class="sp" x="80" y="340" font-size="32" font-weight="500"
            fill="#a59cc9">writes the</text>
      <rect x="254" y="312" width="124" height="40" rx="20"
            fill="#9b6bff" fill-opacity="0.20"
            stroke="#9b6bff" stroke-opacity="0.50" stroke-width="1.5"/>
      <text class="sp" x="316" y="340" font-size="30" font-weight="800"
            text-anchor="middle" fill="#9b6bff">brief</text>
      <text class="sp" x="388" y="340" font-size="32" font-weight="500"
            fill="#a59cc9">and the</text>
      <rect x="518" y="312" width="96" height="40" rx="20"
            fill="#ff3d9a" fill-opacity="0.18"
            stroke="#ff3d9a" stroke-opacity="0.50" stroke-width="1.5"/>
      <text class="sp" x="566" y="340" font-size="30" font-weight="800"
            text-anchor="middle" fill="#ff3d9a">cond.</text>

      <text class="sp" x="80" y="390" font-size="32" font-weight="500"
            fill="#a59cc9">You paste one line. Claude runs.</text>
    </g>

    <!-- Proof badges -->
    <g class="sp-r3">
      <rect x="80" y="420" width="210" height="44" rx="22"
            fill="#3dffa8" fill-opacity="0.12"
            stroke="#3dffa8" stroke-opacity="0.40" stroke-width="1.5"/>
      <circle cx="108" cy="442" r="6" fill="#3dffa8"/>
      <text class="sp" x="124" y="448" font-size="22" font-weight="700"
            fill="#3dffa8">no interruptions</text>

      <rect x="304" y="420" width="188" height="44" rx="22"
            fill="#3dffa8" fill-opacity="0.12"
            stroke="#3dffa8" stroke-opacity="0.40" stroke-width="1.5"/>
      <circle cx="332" cy="442" r="6" fill="#3dffa8"/>
      <text class="sp" x="348" y="448" font-size="22" font-weight="700"
            fill="#3dffa8">verified proof</text>
    </g>

    <!-- ═══════════════ RIGHT SIDE ═══════════════ -->
    <g class="sp-r2">
      <!-- Code block 1: the commands -->
      <rect x="672" y="72" width="572" height="280" rx="20"
            fill="#ffffff" fill-opacity="0.04"
            stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
      <rect x="673" y="73" width="570" height="1.5" rx="0.75"
            fill="#ffffff" fill-opacity="0.18"/>
      <!-- Terminal chrome -->
      <rect x="672" y="72" width="572" height="40" rx="20"
            fill="#0f0e1a"/>
      <rect x="672" y="92" width="572" height="20" fill="#0f0e1a"/>
      <circle cx="698" cy="92" r="6" fill="#ff3d9a" fill-opacity="0.55"/>
      <circle cx="718" cy="92" r="6" fill="#ffd23f" fill-opacity="0.50"/>
      <circle cx="738" cy="92" r="6" fill="#3dffa8" fill-opacity="0.50"/>

      <text class="spm" font-size="22" x="694" y="140" fill="#9b6bff">/goalify migrate our API to OpenAPI 3.1</text>
      <text class="spm" font-size="20" x="694" y="170" fill="#4a4468">↓  api-migration.md + condition string</text>
      <line x1="694" y1="186" x2="1228" y2="186" stroke="#2a2540" stroke-width="1"/>
      <text class="spm" font-size="22" x="694" y="218" fill="#9b6bff">/clear</text>
      <text class="spm" font-size="22" x="694" y="250" fill="#9b6bff">/goal  <tspan fill="#f1edff">Do everything in ~/acme/.goal/</tspan></text>
      <text class="spm" font-size="22" x="694" y="278" fill="#f1edff">       api-migration.md and prove it.</text>
      <text class="spm" font-size="22" x="694" y="306" fill="#6a638a">       Stop after 40 turns.</text>
      <text class="spm" font-size="20" x="694" y="336" fill="#4a4468">paste the whole condition, then walk away</text>
    </g>

    <!-- Code block 2: proof output -->
    <g class="sp-r3">
      <rect x="672" y="376" width="572" height="188" rx="20"
            fill="#ffffff" fill-opacity="0.04"
            stroke="#3dffa8" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="673" y="377" width="570" height="1.5" rx="0.75"
            fill="#3dffa8" fill-opacity="0.28"/>
      <!-- Terminal chrome -->
      <rect x="672" y="376" width="572" height="40" rx="20"
            fill="#0a1510"/>
      <rect x="672" y="396" width="572" height="20" fill="#0a1510"/>
      <circle cx="698" cy="396" r="6" fill="#ff3d9a" fill-opacity="0.55"/>
      <circle cx="718" cy="396" r="6" fill="#ffd23f" fill-opacity="0.50"/>
      <circle cx="738" cy="396" r="6" fill="#3dffa8" fill-opacity="0.70"/>

      <text class="spm" font-size="22" x="694" y="436" fill="#3dffa8">npm test  PASS  47 passed</text>
      <text class="spm" font-size="22" x="694" y="466" fill="#3dffa8">ASYNC-OK</text>
      <text class="spm" font-size="22" x="694" y="496" fill="#4a4468">.goal/done/api-migration.receipt</text>

      <!-- VERIFIED badge -->
      <g class="sp-tick" filter="url(#sp-glow-sm)">
        <rect x="694" y="510" width="160" height="36" rx="18"
              fill="#3dffa8" fill-opacity="0.16"
              stroke="#3dffa8" stroke-opacity="0.55" stroke-width="1.5"/>
        <path d="M714 524 L720 532 L736 514"
              fill="none" stroke="#3dffa8" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
        <text class="sp" font-size="20" font-weight="800" x="746" y="533"
              fill="#3dffa8">VERIFIED</text>
      </g>
    </g>

    <!-- Version footer -->
    <text class="sp" font-size="20" font-weight="600" x="1254" y="618"
          text-anchor="end" fill="#2a2540">v3.0 · a Claude Code skill</text>
  </g>
</svg>
