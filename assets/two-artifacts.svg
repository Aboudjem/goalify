<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="ta-t ta-d">
  <title id="ta-t">goalify — one command writes two artifacts: a brief the worker opens, and a condition the evaluator reads</title>
  <desc id="ta-d">A single goalify command forks into two lanes. The upper lane carries the BRIEF: a file, api-migration.md, opened by a worker whose terminal window has the file open inside it. The lower lane carries the CONDITION: one string you paste whole, which reaches the evaluator through a neutral chip marked with the command name. The evaluator is drawn as a flat panel with no window and a crossed-out folder, because it reads words only and cannot open files. Between the lanes: the condition carries the brief's path. Beneath both lanes, a struck-through near-miss shows that words about the path are not the path.</desc>
  <defs>
    <linearGradient id="ta-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150A28"/>
      <stop offset="1" stop-color="#0C0518"/>
    </linearGradient>
    <radialGradient id="ta-glow" cx="0.18" cy="0.06" r="0.55">
      <stop offset="0" stop-color="#8A00FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8A00FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ta-dots" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#2A1A47"/>
    </pattern>
    <clipPath id="ta-clip"><rect x="2" y="2" width="896" height="696" rx="24"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    /* Two particles riding rails that are drawn in full at every instant, so every frame
       is a complete diagram. 7s = 0.14 Hz; opacity floor .6; the struck group never moves. */
    .dotA{animation:ta-ride 7s ease-in-out infinite}
    .dotB{animation:ta-ride 7s ease-in-out infinite;animation-delay:-3.5s}
    @keyframes ta-ride{0%,100%{transform:translate(0,0);opacity:.6}50%{transform:translate(16px,0);opacity:1}}
    @media (prefers-reduced-motion: reduce){.dotA,.dotB{animation:none;opacity:1}}
  </style>

  <rect x="2" y="2" width="896" height="696" rx="24" fill="url(#ta-bg)" stroke="#33215C" stroke-width="2.5"/>
  <g clip-path="url(#ta-clip)">
    <rect x="2" y="2" width="896" height="696" fill="url(#ta-glow)"/>
    <rect x="2" y="2" width="896" height="696" fill="url(#ta-dots)" opacity="0.5"/>
  </g>

  <!-- header -->
  <text class="sans" font-size="28" font-weight="700" letter-spacing="4" x="40" y="44" fill="#CFC4E8">ONE COMMAND, TWO THINGS</text>
  <text class="sans" font-size="28" font-weight="700" letter-spacing="4" x="860" y="44" text-anchor="end" fill="#CFC4E8" opacity="0.8">TWO READERS</text>
  <line x1="40" y1="64" x2="860" y2="64" stroke="#CFC4E8" stroke-width="1.5" opacity="0.22"/>

  <!-- the fork: one act, two lanes. Both curves leave the command horizontally and resolve to
       dead horizontal at the cards, so at 380px this reads as two separated channels rather
       than a compressing X. Each carries its own lane colour; neither crosses the other. -->
  <path d="M208 320 C 252 320, 258 196, 264 196" fill="none" stroke="#F0916A" stroke-width="4"/>
  <path d="M208 320 C 252 320, 258 464, 264 464" fill="none" stroke="#C4A6FF" stroke-width="4" stroke-dasharray="12 8"/>

  <!-- origin: the single command both artifacts come out of -->
  <rect x="40" y="288" width="168" height="64" rx="8" fill="#1E0F38" stroke="#33215C" stroke-width="2"/>
  <text class="mono" font-size="28" font-weight="700" x="124" y="330" text-anchor="middle" fill="#F4F0FF">/goalify</text>
  <text class="sans" font-size="28" x="40" y="396" fill="#CFC4E8">writes both</text>

  <!-- laneA — the BRIEF: sharp corners, folded top-right, solid warm rail -->
  <path d="M264 120 H596 L620 144 V272 H264 Z" fill="#1E0F38" stroke="#F0916A" stroke-width="2.5"/>
  <path d="M264 120 H596 L620 144 V272 H264 Z" fill="none" stroke="#F0916A" stroke-width="7" opacity="0.22"/>
  <path d="M596 120 L620 144 H596 Z" fill="#150A28" stroke="#F0916A" stroke-width="2.5"/>
  <text class="sans" font-size="30" font-weight="800" x="284" y="168" fill="#F0916A">BRIEF</text>
  <text class="sans" font-size="28" font-weight="700" letter-spacing="1.5" x="600" y="168" text-anchor="end" fill="#F0916A">A FILE</text>
  <text class="mono" font-size="28" x="284" y="216" fill="#F4F0FF">api-migration.md</text>
  <text class="sans" font-size="28" x="284" y="254" fill="#CFC4E8">the worker opens it</text>

  <line x1="620" y1="196" x2="648" y2="196" stroke="#F0916A" stroke-width="4"/>
  <path d="M648 189 L660 196 L648 203 Z" fill="#F0916A"/>
  <rect class="dotA" x="624" y="192" width="8" height="8" fill="#F0916A"/>

  <!-- the worker gets a window, with the brief open inside it -->
  <rect x="660" y="120" width="210" height="152" rx="10" fill="#1E0F38" stroke="#33215C" stroke-width="2"/>
  <circle cx="680" cy="142" r="5" fill="#33215C" stroke="#4A3372" stroke-width="1.5"/>
  <circle cx="698" cy="142" r="5" fill="#33215C" stroke="#4A3372" stroke-width="1.5"/>
  <circle cx="716" cy="142" r="5" fill="#33215C" stroke="#4A3372" stroke-width="1.5"/>
  <path d="M680 164 H704 L712 172 V200 H680 Z" fill="none" stroke="#F0916A" stroke-width="2"/>
  <path d="M686 180 H706 M686 188 H702" stroke="#F0916A" stroke-width="1.5" opacity="0.5"/>
  <text class="sans" font-size="30" font-weight="800" x="680" y="228" fill="#F4F0FF">WORKER</text>
  <text class="sans" font-size="28" x="680" y="260" fill="#CFC4E8">opens it</text>

  <!-- the rule that binds the two lanes; starts at the lane origin, clear of the fork chip -->
  <line x1="264" y1="282" x2="870" y2="282" stroke="#33215C" stroke-width="1.5"/>
  <text class="sans" font-size="28" x="264" y="312" fill="#CFC4E8">The condition carries the brief's path.</text>

  <!-- laneB — the CONDITION: capsule corners, dashed cool rail -->
  <rect x="264" y="388" width="356" height="152" rx="24" fill="#1E0F38" stroke="#C4A6FF" stroke-width="2.5"/>
  <rect x="264" y="388" width="356" height="152" rx="24" fill="none" stroke="#C4A6FF" stroke-width="7" opacity="0.22"/>
  <text class="sans" font-size="30" font-weight="800" x="284" y="436" fill="#C4A6FF">CONDITION</text>
  <text class="sans" font-size="28" font-weight="700" letter-spacing="1.5" x="600" y="436" text-anchor="end" fill="#C4A6FF">STRING</text>
  <text class="mono" font-size="28" x="284" y="484" fill="#F4F0FF">Do everything in<tspan fill="#22D3EE">…</tspan></text>
  <text class="sans" font-size="28" x="284" y="522" fill="#CFC4E8">you paste it whole</text>

  <line x1="620" y1="464" x2="648" y2="464" stroke="#C4A6FF" stroke-width="4" stroke-dasharray="12 8"/>
  <path d="M648 457 L660 464 L648 471 Z" fill="#C4A6FF"/>
  <circle class="dotB" cx="628" cy="464" r="4" fill="#C4A6FF"/>

  <!-- the command is a neutral chip beside the plate, never wrapped around it; the dashed
       cool line arrives at the chip, and the condition passes through it to the evaluator -->
  <line x1="634" y1="378" x2="634" y2="461" stroke="#C4A6FF" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>
  <rect x="580" y="330" width="108" height="48" rx="8" fill="#150A28" stroke="#33215C" stroke-width="2"/>
  <text class="mono" font-size="28" font-weight="700" x="634" y="362" text-anchor="middle" fill="#C4A6FF">/goal</text>

  <!-- the evaluator gets no window and no file: the absence is the argument -->
  <rect x="660" y="388" width="210" height="168" rx="4" fill="#150A28" stroke="#33215C" stroke-width="2"/>
  <path d="M680 420 H692 L696 414 H716 V448 H680 Z" fill="none" stroke="#CFC4E8" stroke-width="1.5" opacity="0.5"/>
  <path d="M686 424 L710 442 M710 424 L686 442" stroke="#FF5C8A" stroke-width="3" stroke-linecap="round"/>
  <text class="sans" font-size="30" font-weight="800" x="680" y="482" fill="#F4F0FF">EVALUATOR</text>
  <text class="sans" font-size="28" x="680" y="514" fill="#CFC4E8">words only</text>
  <text class="sans" font-size="28" x="680" y="544" fill="#CFC4E8">no files</text>

  <line x1="40" y1="580" x2="860" y2="580" stroke="#CFC4E8" stroke-width="1.5" opacity="0.22"/>
  <text class="sans" font-size="28" x="40" y="612" fill="#CFC4E8">The condition names the brief inside its words.</text>

  <!-- the near-miss — struck, static, never animated -->
  <g data-antipattern="v1">
    <text class="mono" font-size="28" x="40" y="652" fill="#CFC4E8">/goal the brief's path</text>
    <line x1="40" y1="643" x2="424" y2="643" stroke="#FF5C8A" stroke-width="2.5"/>
    <text class="sans" font-size="28" x="40" y="688" fill="#CFC4E8">words about the path are not the path.</text>
  </g>
</svg>
