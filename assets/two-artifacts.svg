<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" fill="none" role="img" aria-label="goalify writes two artifacts: a brief file and a condition string">
  <title>goalify writes two artifacts: a brief file and a condition string</title>
  <desc>A two-lane diagram. The left lane shows the brief: a long-form markdown file with full instructions. The right lane shows the condition: one self-contained line of text that the goal command uses to evaluate the run. A struck-through counter-example at the bottom shows that passing only a path after goal is the wrong form, because the evaluator cannot read files at runtime.</desc>
  <defs>
    <linearGradient id="ta-bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#0d0b1a"/>
      <stop offset="100%" stop-color="#07060f"/>
    </linearGradient>
    <radialGradient id="ta-gA" cx="0.15" cy="0.20" r="0.65">
      <stop offset="0%"   stop-color="#9b6bff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ta-gB" cx="0.88" cy="0.78" r="0.55">
      <stop offset="0%"   stop-color="#ff3d9a" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#ff3d9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ta-brand" x1="0" y1="0" x2="1" y2="0">
      <stop class="ta-d1" offset="0%"   stop-color="#9b6bff"/>
      <stop class="ta-d2" offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <filter id="ta-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .ta  { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .tam { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }

    @keyframes ta-d1 { 0%,100% { stop-color:#9b6bff; } 50% { stop-color:#2ee6ff; } }
    @keyframes ta-d2 { 0%,100% { stop-color:#2ee6ff; } 50% { stop-color:#ff3d9a; } }
    .ta-d1 { animation: ta-d1 16s ease-in-out infinite; }
    .ta-d2 { animation: ta-d2 16s ease-in-out infinite 2s; }

    @keyframes ta-bloom { 0%,100% { opacity:.65; } 50% { opacity:1; } }
    .ta-bloom { animation: ta-bloom 11s ease-in-out infinite; }

    @keyframes ta-rise { from { transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .ta-r1 { animation: ta-rise 0.6s ease-out 0.3s both; }
    .ta-r2 { animation: ta-rise 0.6s ease-out 0.7s both; }
    .ta-r3 { animation: ta-rise 0.6s ease-out 1.1s both; }

    @keyframes ta-tw { 0%,100% { opacity:.08; } 50% { opacity:.45; } }
    .ta-t1 { animation: ta-tw 7s ease-in-out infinite 0s; }
    .ta-t2 { animation: ta-tw 9s ease-in-out infinite 4s; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="900" height="640" fill="url(#ta-bg)"/>
  <g class="ta-bloom">
    <rect width="900" height="640" fill="url(#ta-gA)"/>
    <rect width="900" height="640" fill="url(#ta-gB)"/>
  </g>
  <rect x="1.5" y="1.5" width="897" height="637" rx="24"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="1.5" rx="0.75"
        fill="#ffffff" fill-opacity="0.15"/>

  <!-- Stars -->
  <circle class="ta-t1" cx="820" cy="60"  r="1.0" fill="#ffffff"/>
  <circle class="ta-t2" cx="58"  cy="580" r="0.9" fill="#ffffff"/>

  <!-- Masthead -->
  <g class="ta-r1" filter="url(#ta-glow)">
    <g fill="none" stroke="url(#ta-brand)" stroke-width="2.2">
      <circle cx="70" cy="48" r="16"/>
      <circle cx="70" cy="48" r="9"  stroke-width="1.7" opacity="0.80"/>
      <circle cx="70" cy="48" r="3"  stroke-width="1.5" opacity="0.62"/>
    </g>
    <line x1="52" y1="30" x2="82" y2="60" stroke="#2ee6ff" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="49" cy="27" r="2.5" fill="#2ee6ff"/>
    <circle cx="70" cy="48" r="2.0" fill="#3dffa8"/>
    <text class="ta" x="100" y="58" font-size="36" font-weight="800"
          letter-spacing="-1.1" fill="url(#ta-brand)">two artifacts</text>
  </g>

  <!-- TWO LANE CARDS -->

  <!-- Lane A: BRIEF (purple, left) -->
  <g class="ta-r2">
    <rect x="40" y="84" width="390" height="340" rx="24"
          fill="#ffffff" fill-opacity="0.04"
          stroke="#9b6bff" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="41" y="85" width="388" height="1.5" rx="0.75"
          fill="#9b6bff" fill-opacity="0.30"/>
    <rect x="40" y="84" width="7" height="340" rx="3.5" fill="#9b6bff"/>

    <text class="ta" font-size="30" font-weight="800" x="68" y="124"
          fill="#9b6bff">BRIEF</text>
    <rect x="272" y="98" width="72" height="32" rx="16"
          fill="#9b6bff" fill-opacity="0.20"
          stroke="#9b6bff" stroke-opacity="0.45" stroke-width="1"/>
    <text class="ta" font-size="18" font-weight="700" x="308" y="119"
          text-anchor="middle" fill="#9b6bff">FILE</text>
    <text class="ta" font-size="22" font-weight="500" x="68" y="154"
          fill="#a59cc9">api-migration.md</text>

    <!-- Doc lines -->
    <text class="tam" font-size="16" x="68" y="192" fill="#f1edff">## Goal</text>
    <text class="tam" font-size="16" x="68" y="214" fill="#8877b0">Migrate all REST endpoints to</text>
    <text class="tam" font-size="16" x="68" y="234" fill="#8877b0">OpenAPI 3.1 with Zod schemas.</text>
    <text class="tam" font-size="16" x="68" y="268" fill="#f1edff">## Acceptance</text>
    <text class="tam" font-size="16" x="68" y="288" fill="#8877b0">- npm test green, 0 skips</text>
    <text class="tam" font-size="16" x="68" y="308" fill="#8877b0">- /health returns 200</text>
    <text class="tam" font-size="16" x="68" y="328" fill="#8877b0">- no any[] in src/</text>
    <text class="tam" font-size="16" x="68" y="362" fill="#f1edff">## Context</text>
    <text class="tam" font-size="16" x="68" y="382" fill="#8877b0">Express 4, Node 22, Prisma 5.x</text>
    <text class="tam" font-size="16" x="68" y="406" fill="#a59cc9">... (full instructions)</text>
  </g>

  <!-- Lane B: CONDITION (pink, right) -->
  <g class="ta-r2">
    <rect x="470" y="84" width="390" height="340" rx="24"
          fill="#ffffff" fill-opacity="0.04"
          stroke="#ff3d9a" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="471" y="85" width="388" height="1.5" rx="0.75"
          fill="#ff3d9a" fill-opacity="0.30"/>
    <rect x="470" y="84" width="7" height="340" rx="3.5" fill="#ff3d9a"/>

    <text class="ta" font-size="30" font-weight="800" x="498" y="124"
          fill="#ff3d9a">CONDITION</text>
    <rect x="772" y="98" width="72" height="32" rx="16"
          fill="#ff3d9a" fill-opacity="0.20"
          stroke="#ff3d9a" stroke-opacity="0.45" stroke-width="1"/>
    <text class="ta" font-size="18" font-weight="700" x="808" y="119"
          text-anchor="middle" fill="#ff3d9a">LINE</text>

    <!-- Condition chip -->
    <rect x="498" y="148" width="346" height="130" rx="16"
          fill="#ff3d9a" fill-opacity="0.08"
          stroke="#ff3d9a" stroke-opacity="0.30" stroke-width="1.5"/>
    <text class="tam" font-size="15" x="514" y="176" fill="#f1edff">Do everything in</text>
    <text class="tam" font-size="15" x="514" y="198" fill="#f1edff">~/acme/.goal/api-migration.md</text>
    <text class="tam" font-size="15" x="514" y="220" fill="#f1edff">and prove it, done when the last</text>
    <text class="tam" font-size="15" x="514" y="242" fill="#f1edff">turn quotes npm test passing and</text>
    <text class="tam" font-size="15" x="514" y="264" fill="#f1edff">says ASYNC-OK. Stop after 40 turns.</text>

    <text class="ta" font-size="20" font-weight="500" x="498" y="328"
          fill="#a59cc9">Paste this whole string into</text>
    <rect x="498" y="336" width="84" height="34" rx="12"
          fill="#ffffff" fill-opacity="0.10"
          stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text class="tam" font-size="20" font-weight="700" x="540" y="359"
          text-anchor="middle" fill="#f1edff">/goal</text>
    <text class="ta" font-size="20" font-weight="500" x="592" y="358"
          fill="#a59cc9">after /clear.</text>
  </g>

  <!-- Arrow joining the two lanes -->
  <line x1="450" y1="254" x2="466" y2="254"
        stroke="url(#ta-brand)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="466,249 474,254 466,259" fill="url(#ta-brand)"/>

  <!-- Counter-example (WRONG): struck-out path form -->
  <g class="ta-r3">
    <rect x="40" y="444" width="820" height="168" rx="20"
          fill="#ffffff" fill-opacity="0.03"
          stroke="#ffd23f" stroke-opacity="0.30" stroke-width="1.5"/>
    <rect x="41" y="445" width="818" height="1.5" rx="0.75"
          fill="#ffd23f" fill-opacity="0.20"/>

    <rect x="40" y="444" width="7" height="168" rx="3.5" fill="#ffd23f"/>

    <rect x="56" y="452" width="114" height="26" rx="13"
          fill="#ffd23f" fill-opacity="0.18"
          stroke="#ffd23f" stroke-opacity="0.50" stroke-width="1"/>
    <text class="ta" font-size="15" font-weight="700" x="113" y="470"
          text-anchor="middle" fill="#ffd23f" letter-spacing="0.5">WRONG FORM</text>

    <!-- struck-out antipattern -->
    <g data-antipattern="v1">
      <text class="tam" font-size="24" x="68" y="516" fill="#8a82b6">/goal the brief's path</text><!-- v1-antipattern -->
      <line x1="68" y1="508" x2="332" y2="508" stroke="#ffd23f" stroke-width="2.5"/>
      <text class="ta" font-size="22" x="68" y="558" fill="#ffd23f">words about the path are not the path.</text>
    </g>

    <text class="ta" font-size="20" x="68" y="594" fill="#6a638a">Pass the full condition string, not a file path. The evaluator cannot open files.</text>
  </g>
</svg>
