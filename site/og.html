<!doctype html><html><head><meta charset="utf-8"><title>goalify og card</title><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:radial-gradient(900px 520px at 85% -10%,#2a1563 0%,transparent 62%),radial-gradient(700px 460px at -5% 30%,#0b3a52 0%,transparent 58%),#07060f;color:#f1edff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;position:relative}
.s{position:absolute;border-radius:50%;background:#fff}
.wrap{position:absolute;inset:0;padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:-.02em}
h1{font-size:76px;line-height:1.02;letter-spacing:-.05em;font-weight:700;max-width:900px}
.g{background:linear-gradient(90deg,#9b6bff,#ff3d9a,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:14px;align-items:center}
.pill{padding:12px 20px;border-radius:999px;font-size:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.pill b{color:#3dffa8}
.ok{position:absolute;right:84px;top:76px;padding:14px 26px;border-radius:999px;font:700 26px/1 -apple-system,system-ui;letter-spacing:.06em;color:#3dffa8;background:rgba(61,255,168,.10);border:1px solid rgba(61,255,168,.45);box-shadow:0 0 60px -10px rgba(61,255,168,.6)}
</style></head><body>
<div id="stars"></div>
<div class="wrap">
<div class="brand"><svg width="40" height="40" viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9b6bff"/><stop offset="1" stop-color="#2ee6ff"/></linearGradient></defs><circle cx="16" cy="16" r="13" fill="none" stroke="url(#lg)" stroke-width="2.4"/><circle cx="16" cy="16" r="7" fill="none" stroke="url(#lg)" stroke-width="2.4" opacity=".7"/><path d="M12.4 16.2l2.6 2.6 5-5.4" fill="none" stroke="#3dffa8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>goalify 3.0</div>
<h1>Hand your AI a job that takes days.<br><span class="g">Come back to proof.</span></h1>
<div class="row"><span class="pill"><b>0</b> questions mid-run</span><span class="pill">non-stop for hours or days</span><span class="pill">proof, not a promise</span></div>
</div>
<div class="ok">VERIFIED</div>
<script>
// deterministic star sprinkle (seeded), so the card renders the same every time
var s=7,st=document.getElementById('stars');function r(){s=(s*16807)%2147483647;return s/2147483647}
for(var i=0;i<140;i++){var d=document.createElement('i');d.className='s';var z=r(),sz=z>.93?2.4:z>.7?1.5:1;
d.style.cssText='left:'+(r()*1200)+'px;top:'+(r()*630)+'px;width:'+sz+'px;height:'+sz+'px;opacity:'+(.25+r()*.6)+(z>.93?';box-shadow:0 0 8px #fff':'');st.appendChild(d)}
</script>
</body></html>
