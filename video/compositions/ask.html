      var gapQ = SHORT ? 0.36 : 0.62;
      tl.fromTo("#ak-on", { opacity: 0, y: 14, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, tOn);

          nEl.textContent = Math.round(cnt.n);
        },
      }, tQ);
      qs.forEach(function (q, i) {
        tl.fromTo("#ak-n", { scale: 1 }, { scale: 1.35, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, tQ + i * gapQ);
