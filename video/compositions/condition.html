  <script>
    (function () {
      var F = window.Film;
      var tl = gsap.timeline({ paused: true });

      // multi-span typewriter, one proxy for the whole line
      function typeSpans(spans, t0, dur) {
        var parts = [],
          total = 0;
        spans.forEach(function (s) {
          var txt = s.getAttribute("data-text");
          parts.push({ el: s, txt: txt, a: total });
          total += txt.length;
          s.textContent = "";
        });
        var o = { n: 0 };
        tl.fromTo(
          o,
          { n: 0 },
          {
            n: total,
            duration: dur,
            ease: "none",
            onUpdate: function () {
              var k = Math.round(o.n);
              parts.forEach(function (p) {
                p.el.textContent = p.txt.slice(0, Math.max(0, Math.min(p.txt.length, k - p.a)));
              });
            },
          },
          t0
        );
      }

      tl.fromTo("#cd-chip", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 0);
      tl.fromTo("#cd-term", { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.08);
      typeSpans(Array.prototype.slice.call(document.querySelectorAll("#cd-l1 .cd-t")), 0.3, 0.18);
      tl.to("#cd-l1", { opacity: 0.38, duration: 0.2 }, 0.6);
      tl.fromTo("#cd-l2", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 0.66);
      typeSpans(Array.prototype.slice.call(document.querySelectorAll("#cd-l2 .cd-t")), 0.7, 1.55);
      F.caption(tl, document.getElementById("cd-cap"), 0.35, 3.88);
      // enter: the run starts
      tl.fromTo("#cd-l2", { scale: 1 }, { scale: 1.015, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 50%" }, 2.45);
      tl.fromTo("#cd-term", { borderColor: "rgba(255,255,255,0.12)" }, { borderColor: "rgba(155,107,255,0.75)", duration: 0.25, ease: "power2.out" }, 2.45);
      tl.fromTo("#cd-run", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 2.6);
      // exit
      tl.to(["#cd-term", "#cd-chip"], { opacity: 0, x: -80, filter: "blur(12px)", duration: 0.26, ease: "power3.in" }, 3.72);

      window.__timelines["condition"] = tl;
    })();
  </script>
