  </style>
  <div id="root" data-composition-id="goal" data-width="1920" data-height="1080">
    <div class="cam" id="gl-cam"><div class="rig" id="gl-rig">
    <div id="gl-tag" class="glass">example requests</div>
    <div class="gl-card" id="gl-c0">
      <div class="gl-face gl-front glass"><div class="gl-eye">Your request</div><div class="gl-txt">Build a website for my bakery</div></div>
      <div class="gl-face gl-back glass"><div class="gl-eye">● Goal</div><div class="gl-txt">Bakery website live</div></div>
    </div>
    <div class="gl-card" id="gl-c1">
      <div class="gl-face gl-front glass"><div class="gl-eye">Your request</div><div class="gl-txt">Sort my 3,000 photos by trip</div></div>
      <div class="gl-face gl-back glass"><div class="gl-eye">● Goal</div><div class="gl-txt">Every photo in the right album</div></div>
    </div>
    <div class="gl-card" id="gl-c2">

    <div id="gl-big" class="glass">
      <div class="gl-eye" style="color: var(--green); font-size: 26px">Goal</div>

      <div id="gl-fl">Finish line</div>
      <div class="gl-row"><span class="gl-box"></span>Every page loads</div>

      <div class="gl-row"><span class="gl-box"></span>Order button works</div>

      <div id="gl-fill"></div>
      <div id="gl-dot"></div>
    </div>
    <svg id="gl-flag" viewBox="0 0 120 140"><line x1="14" y1="8" x2="14" y2="136" stroke="#f1edff" stroke-width="6" stroke-linecap="round" /><path id="gl-pen" d="M17 12 C50 2 70 26 110 14 L110 64 C70 76 50 52 17 62 Z" fill="#3dffa8" /></svg>

  </div></div>
  </div>
  <script>
    (function () {
      var F = window.Film;
      var P = F.portrait();
      var MODE = F.cut(); // main: flips + the goal up close; short: the goal only; demo: flips only
      var tl = gsap.timeline({ paused: true });
      window.Film.push(tl, "#gl-cam", 9, 1, 1.04);
      var cards = ["#gl-c0", "#gl-c1", "#gl-c2"];

      function flip(sel, t) {
        var f = document.querySelector(sel + " .gl-front"),
          b = document.querySelector(sel + " .gl-back");
        tl.fromTo(f, { rotationY: 0, opacity: 1 }, { rotationY: 90, duration: 0.2, ease: "power2.in" }, t);
        tl.fromTo(b, { rotationY: -90, opacity: 0 }, { rotationY: 0, opacity: 1, duration: 0.28, ease: "back.out(1.6)", immediateRender: false }, t + 0.2);
        tl.fromTo(sel, { scale: 1 }, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t + 0.38);
      }
      // backs start hidden
      tl.fromTo(".gl-back", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      if (MODE === "short") {
        tl.fromTo(["#gl-tag"].concat(cards), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      } else {
        tl.fromTo("#gl-tag", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 0.05);
        tl.fromTo(cards, { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out", stagger: 0.1 }, 0);
        var t0 = MODE === "demo" ? 0.4 : 0.6,
          gap = MODE === "demo" ? 0.42 : 0.55;
        cards.forEach(function (c, i) {
          flip(c, t0 + i * gap);
        });
      }

      // the goal, up close
      var tBig = MODE === "short" ? 0 : 2.7;
      if (MODE !== "demo") {
        if (MODE === "main") {
          tl.to(["#gl-c1", "#gl-c2", "#gl-tag"], { opacity: 0, filter: "blur(10px)", scale: 0.92, duration: 0.3, ease: "power3.in" }, tBig);
          // carry the first goal card into the close-up
          var c0 = document.getElementById("gl-c0"),
            big = document.getElementById("gl-big");
          var dx = big.offsetLeft + big.offsetWidth / 2 - (c0.offsetLeft + c0.offsetWidth / 2);
          var dy = big.offsetTop + big.offsetHeight / 2 - (c0.offsetTop + c0.offsetHeight / 2);
          // one element grows into the close-up: its small label fades first, then the card hands over
          tl.to("#gl-c0 .gl-back .gl-eye, #gl-c0 .gl-back .gl-txt", { opacity: 0, duration: 0.14, ease: "power2.in" }, tBig);
          tl.to("#gl-c0", { x: dx, y: dy, scale: big.offsetWidth / c0.offsetWidth, duration: 0.5, ease: "power3.inOut" }, tBig);
          tl.to("#gl-c0", { opacity: 0, duration: 0.14 }, tBig + 0.48);
        }
        var tb = MODE === "short" ? 0 : tBig + 0.44;
        tl.fromTo("#gl-big", { opacity: 0, scale: MODE === "short" ? 0.92 : 1, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, tb);
        tl.fromTo("#gl-flag", { opacity: 0, y: 30, scale: 0.6, transformOrigin: "10% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, tb + 0.25);
        tl.fromTo("#gl-pen", { skewY: 0, transformOrigin: "0% 50%" }, { skewY: -6, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut" }, tb + 0.6);
        tl.fromTo("#gl-fl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tb + 0.35);
        tl.fromTo("#gl-big .gl-row", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.32, ease: "expo.out", stagger: 0.22 }, tb + 0.5);
        // "keeps going until it's proven": the run heads for the flag and is not there yet
        var trackW = document.getElementById("gl-track").offsetWidth;
        var k = MODE === "short" ? 0.45 : 1;
        tl.fromTo("#gl-track", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tb + 0.6 * k);
        tl.fromTo("#gl-fill", { scaleX: 0 }, { scaleX: 0.78, duration: 2.2 * k, ease: "power2.out" }, tb + 0.8 * k);
        tl.fromTo("#gl-dot", { x: 0, opacity: 0 }, { x: trackW * 0.78, opacity: 1, duration: 2.2 * k, ease: "power2.out" }, tb + 0.8 * k);
        tl.fromTo("#gl-dot", { scale: 1 }, { scale: 1.45, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, tb + 3.0 * k);
        // the two finish-line boxes pulse: still empty
        tl.fromTo("#gl-big .gl-box", { borderColor: "rgba(255,255,255,0.55)", boxShadow: "0 0 0px rgba(46,230,255,0)" }, { borderColor: "rgba(46,230,255,1)", boxShadow: "0 0 22px rgba(46,230,255,0.8)", duration: 0.22, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.18, immediateRender: false }, tb + 2.4 * k);
      } else {
        tl.fromTo(["#gl-big", "#gl-flag"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      }

      // exit
      var tEnd = MODE === "short" ? 1.72 : MODE === "demo" ? 2.18 : 8.6;
      if (MODE === "main") {
        // carry: the flag flies to the next scene's checklist header (same spot, same size there)
        var fl = document.getElementById("gl-flag");
        var tx = P ? 118 : 202,
          ty = P ? 332 : 228;
        // the card stays on screen (dimming, sliding toward the checklist) while the flag leaves at about 48 px
        tl.to("#gl-big", { opacity: 0.55, x: P ? 0 : -120, scale: 0.9, duration: 0.45, ease: "power3.inOut" }, tEnd);
        tl.to("#gl-flag", { x: tx - (fl.offsetLeft + 48), y: ty - (fl.offsetTop + 56), scale: 0.5, transformOrigin: "50% 50%", duration: 0.45, ease: "power3.inOut" }, tEnd);
      } else {
        tl.to(MODE === "demo" ? cards.concat(["#gl-tag"]) : ["#gl-big", "#gl-flag"], { opacity: 0, filter: "blur(12px)", scale: 0.96, duration: 0.22, ease: "power3.in" }, tEnd);
      }

      window.__timelines["goal"] = tl;
    })();
  </script>
