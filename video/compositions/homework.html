      function off(el) {
        var x = 0,

          w = el.offsetWidth,
          h = el.offsetHeight;

      var b1 = off(document.getElementById("hw-y1")),

      tl.fromTo("#hw-cmd", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 0);
