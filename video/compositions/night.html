    #nt-ring {
      position: absolute;
      width: 130px;
      height: 130px;
      margin: -65px 0 0 -65px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }
    #nt-status {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 16px 26px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    #nt-status span {
      font: 800 40px/1 var(--sans);
      color: #fff;
      white-space: nowrap;
    }
    #nt-status i {
      flex: 1;
      height: 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);

    /* "you, asleep": a small window back on the bed */
    #nt-me {
      position: absolute;

    #nt-mef {

    #nt-mez {
      position: absolute;

    }
    #nt-melab {
      position: absolute;
      left: 1420px;

      font: 750 30px var(--sans);
      color: #fff;
    }
    #nt-brand {
      position: absolute;
      right: 36px;
      top: 26px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px 8px 10px;
      border-radius: 999px;
      background: rgba(7, 6, 15, 0.6);
      font: 700 34px/1 var(--sans);
      letter-spacing: -0.04em;
      color: #fff;
    }
    #nt-brand svg {
      width: 46px;
      height: 46px;
    }
    @media (max-aspect-ratio: 1/1) {
      #nt-zz {
        left: 360px;
        top: 560px;
      }
      #nt-chat {
        left: 30px;
        top: 470px;
        width: 1020px;
        height: 610px;

      #nt-bar {
        height: 74px;
        font-size: 26px;
        padding: 0 22px;
      }
      #nt-stack {
        left: 24px;

        gap: 12px;
      }

        display: none !important;
      }
      .nt-b {

      }

        font-size: 24px;
      }
      #nt-status {

        bottom: 20px;

      }

        font-size: 36px;

        height: 260px;
      }

        top: 32px;
        width: 208px;
        height: 240px;
      }
      #nt-mez {
        left: 290px;
        top: 160px;
        font-size: 56px;
      }
      #nt-melab {
        left: 360px;

        width: auto;
        text-align: left;

      }
      #nt-brand {
        top: 60px;
      }
    }
  </style>
  <div id="root" data-composition-id="night" data-width="1920" data-height="1080">
    <div class="cam" id="nt-cam"><div class="rig" id="nt-rig">
      <div id="nt-roomwrap"></div>
      <div id="nt-zz"><span class="nt-z">z</span><span class="nt-z">z</span><span class="nt-z">Z</span></div>
      <div id="nt-dim"></div>
      <div id="nt-chat" class="glass">
        <div id="nt-bar"><span>AI chat</span><span class="nt-chip">example</span><span class="nt-chip" id="nt-now">11:12 PM</span></div>
        <div id="nt-stack">
          <div class="nt-b me nt-old">Build a website for my bakery.</div>
          <div class="nt-b nt-old">On it!</div>
          <div class="nt-b q first" id="nt-q1"><span>Which font do you like?</span><span class="nt-t">11:12 PM</span><span id="nt-ring"></span></div>
          <div class="nt-b q" id="nt-q2"><span>Which colors?</span><span class="nt-t">11:40 PM</span></div>
          <div class="nt-b q" id="nt-q3"><span>Are you there?</span><span class="nt-t">2:15 AM</span></div>
          <div class="nt-b q" id="nt-q4"><span>Hello??</span><span class="nt-t">4:50 AM</span></div>
        </div>
        <div id="nt-status"><span>0 of 6 pages built</span><i></i></div>
      </div>
      <div id="nt-me"><div id="nt-mef"></div></div>
      <div id="nt-mez">zzz</div>
      <div id="nt-melab">You, asleep</div>
      <div id="nt-brand"><svg viewBox="0 0 256 256" fill="none"><g stroke="#a78cff" stroke-width="16" stroke-linecap="round"><circle cx="128" cy="128" r="26" /><circle cx="128" cy="128" r="56" /><circle cx="128" cy="128" r="86" /></g><line x1="200" y1="56" x2="128" y2="128" stroke="#c77dff" stroke-width="20" stroke-linecap="round" /><circle cx="128" cy="128" r="10" fill="#fff" /></svg>goalify</div>
    </div></div>
    <div id="nt-veil"></div>
  </div>
  <script>
    (function () {
      var F = window.Film,
        T = window.Toon;
      var P = F.portrait();
      var D = F.slot("night") || 14;
      var TY = F.seg("night", "type"),
        SL = F.seg("night", "sleep"),
        Q = F.seg("night", "q"),
        W = F.seg("night", "wake");
      var LOOP = F.cut() === "loop";
      var COLD = !!Q && Q[0] < 0.05 && !LOOP;
      var tl = gsap.timeline({ paused: true });
      F.push(tl, "#nt-cam", D, 1, 1.035);

      document.getElementById("nt-roomwrap").innerHTML = T.room("nr");
      document.getElementById("nt-mef").innerHTML = T.face();
      var face = document.getElementById("nr-char"),
        meFace = document.getElementById("nt-mef");
      T.night0("nr");
      gsap.set(["#nt-chat", "#nt-me", "#nt-mez", "#nt-melab", ".nt-z"], { opacity: 0 });
      gsap.set("#nt-mef .c-hand", { opacity: 0 });
      T.mood(tl, meFace, "sleep", 0);
      var LY = P ? 70 : 112; // lying down: how far the character sinks into the pillow

      // the laptop: the chat grows out of its screen
      var lap = document.getElementById("nr-laptop"),
        chat = document.getElementById("nt-chat");
      var lx = lap.offsetLeft + lap.offsetWidth / 2,
        ly = lap.offsetTop + lap.offsetHeight * 0.42;
      var cx = chat.offsetLeft + chat.offsetWidth / 2,
        cy = chat.offsetTop + chat.offsetHeight / 2;
      var W0 = P ? 1080 : 1920,
        H0 = P ? 1920 : 1080;
      var origin = ((lx / W0) * 100).toFixed(1) + "% " + ((ly / H0) * 100).toFixed(1) + "%";

      if (!LOOP) tl.fromTo("#nt-brand", { opacity: 0, x: 20 }, { opacity: 0.92, x: 0, duration: 0.4, ease: "expo.out" }, 0.6);
      else gsap.set("#nt-brand", { opacity: 0 });

      function lampOff(t, quick) {
        if (t <= 0) {
          gsap.set("#nr-cone", { opacity: 0 });
          gsap.set("#nr-lamp .lamp-shade", { fill: "#6d5f8e" });
          gsap.set("#nr-shade", { opacity: 0.6 });
          return;
        }
        var d = quick ? 0.01 : 0.12;
        tl.to("#nr-cone", { opacity: 0, duration: d }, t);
        tl.to("#nr-lamp .lamp-shade", { fill: "#6d5f8e", duration: d }, t);
        tl.to("#nr-shade", { opacity: 0.6, duration: quick ? 0.01 : 0.35 }, t);
      }
      function lieDown(t, quick) {
        if (t <= 0) return gsap.set("#nr-char", { y: LY, rotation: -5, transformOrigin: "50% 80%" });
        tl.to("#nr-char", { y: LY, rotation: -5, transformOrigin: "50% 80%", duration: quick ? 0.01 : 0.6, ease: "power2.inOut" }, t);
      }
      function zzz(t0, t1) {
        document.querySelectorAll(".nt-z").forEach(function (z, i) {
          z.style.left = 20 + i * 46 + "px";
          z.style.top = 120 - i * 48 + "px";
          z.style.fontSize = 40 + i * 16 + "px";
          for (var o = t0 + i * 0.3; o < t1 - 0.8; o += 1.6) tl.fromTo(z, { opacity: 0, y: 20, x: 0 }, { keyframes: [{ opacity: 1, y: -16, x: 8, duration: 0.6, ease: "sine.out" }, { opacity: 0, y: -56, x: 22, duration: 0.6, ease: "sine.in" }], immediateRender: false }, o);
        });
      }

      // ---- beat 1: 11:04 PM, he gives his AI a big job (the request is on screen at frame 0) ----
      T.mood(tl, face, "focused", 0);
      if (TY) {
        tl.fromTo("#nr-laptop .lp-dots i", { y: 0 }, { y: -8, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut", stagger: 0.08 }, TY[0] + 0.2);
        tl.to("#nr-laptop .lp-dots", { opacity: 0, duration: 0.1 }, TY[0] + 0.95);
        tl.fromTo("#nr-laptop .lp-on", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, TY[0] + 1.0);
        tl.fromTo("#nr-char", { rotation: 0, transformOrigin: "50% 80%" }, { rotation: 3, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, TY[0] + 1.3);
        T.mood(tl, face, "happy", TY[0] + 1.35);
        T.mood(tl, face, "focused", TY[0] + 2.3);
      }

      // ---- beat 2: he goes to sleep; the lamp goes off, the laptop keeps glowing ----
      if (SL) {
        var s0 = SL[0];
        lieDown(s0 + 0.1);
        T.mood(tl, face, "sleep", s0 + 0.45);
        lampOff(s0 + 0.9);
        T.clock(tl, "nr", 23 * 60 + 4, 23 * 60 + 10, s0, SL[1] - s0);
        zzz(s0 + 1.1, SL[1] + 0.4);
      }

      // ---- beat 3: 11:12 PM, it stops to ask; the questions pile up while he sleeps ----
      if (Q) {
        var q0 = Q[0],
          ql = Q[1] - Q[0];
        if (!SL) {
          // no bedtime shot in this cut: he is already asleep under the zoom
          lieDown(COLD || LOOP ? 0 : q0 + 0.05, COLD || LOOP);
          T.mood(tl, face, "sleep", COLD || LOOP ? 0 : q0 + 0.1);
          lampOff(COLD || LOOP ? 0 : q0 + 0.1, true);
        }
        var fromRest = q0 < 0.05;
        tl.fromTo("#nt-roomwrap", { scale: fromRest ? 1.6 : 1, filter: fromRest ? "blur(10px)" : "blur(0px)", transformOrigin: origin }, { scale: 1.6, filter: "blur(10px)", duration: fromRest ? 0.01 : 0.55, ease: "power3.inOut" }, q0);
        tl.fromTo("#nt-dim", { opacity: fromRest ? 1 : 0 }, { opacity: 1, duration: fromRest ? 0.01 : 0.5 }, q0);
        tl.fromTo(".nt-z", { opacity: 0 }, { opacity: 0, duration: 0.01, immediateRender: false }, q0 + 0.3);
        // the room's own text leaves the blurred background so it never sits under the chat
        tl.fromTo(["#nr-clock", "#nr-laptop .lp-ui"], { opacity: fromRest ? 0 : 1 }, { opacity: 0, duration: fromRest ? 0.01 : 0.3, immediateRender: fromRest }, q0);
        var cFrom = LOOP ? { opacity: 0, x: 0, y: 0, scale: 0.97 } : fromRest ? { opacity: 1, x: 0, y: 0, scale: 1 } : { opacity: 0, x: lx - cx, y: ly - cy, scale: 0.26 };
        tl.fromTo("#nt-chat", cFrom, { opacity: 1, x: 0, y: 0, scale: 1, duration: LOOP ? 0.35 : fromRest ? 0.01 : 0.55, ease: LOOP ? "expo.out" : "power3.inOut" }, q0);
        tl.fromTo(".nt-old", { opacity: 0.45 }, { opacity: 0.45, duration: 0.01 }, 0);
        // the questions, with the time each one was sent (ping on the first, pops after)
        var times = COLD ? [0, 0, 1.0, 1.8].map(function (x) { return x * Math.min(1, ql / 3); }) : [0.5, 1.3, 2.1, 2.9].map(function (x) { return x * Math.min(1, ql / 4); });
        var clockTxt = ["11:12 PM", "11:40 PM", "2:15 AM", "4:50 AM"];
        var nowEl = document.getElementById("nt-now");
        var stamp = { k: 0 };
        tl.fromTo(stamp, { k: 0 }, { k: 3, duration: Math.max(0.01, times[3] - times[0]), ease: "none", immediateRender: false, onUpdate: function () {
          var k = 0;
          for (var j = 0; j < 4; j++) if (tl.time() >= q0 + times[j] - 0.001) k = j;
          nowEl.textContent = clockTxt[k];
        } }, q0 + times[0]);
        ["#nt-q1", "#nt-q2", "#nt-q3", "#nt-q4"].forEach(function (sel, j) {
          var t = q0 + times[j];
          if (times[j] < 0.01 && fromRest) tl.fromTo(sel, { opacity: 1, scale: 1 }, { opacity: 1, scale: 1, duration: 0.01 }, 0);
          else tl.fromTo(sel, { opacity: 0, y: 14, scale: 0.9, transformOrigin: "0% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t - 0.05);
        });
        var r1 = document.getElementById("nt-ring");
        r1.style.left = "auto";
        r1.style.right = "-20px";
        r1.style.top = "50%";
        var tp = q0 + (COLD ? 0.5 : times[0]);
        tl.fromTo("#nt-ring", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 2.4, duration: 0.6, ease: "power2.out", immediateRender: false }, tp);
        tl.fromTo("#nt-q1", { borderColor: "rgba(255,255,255,0.12)" }, { borderColor: "rgba(184, 166, 255,0.7)", duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, tp);
        // the frozen line: nothing built
        tl.fromTo("#nt-status", { opacity: fromRest ? 1 : 0 }, { opacity: 1, duration: fromRest ? 0.01 : 0.3 }, fromRest ? 0 : q0 + 0.4);
        tl.fromTo("#nt-status", { scale: 1 }, { scale: 1.03, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, q0 + Math.min(ql - 0.6, times[3] + 0.5));
        // a glance back at the bed: still asleep
        tl.fromTo(["#nt-me", "#nt-melab"], { opacity: fromRest && !LOOP ? 1 : 0, scale: fromRest && !LOOP ? 1 : 0.6 }, { opacity: 1, scale: 1, duration: fromRest && !LOOP ? 0.01 : 0.4, ease: "back.out(2)" }, fromRest && !LOOP ? 0 : q0 + 0.6);
        tl.fromTo("#nt-mez", { opacity: 0, y: 10 }, { opacity: 1, y: -10, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor(ql / 0.6) - 2), ease: "sine.inOut", immediateRender: false }, q0 + 0.8);
        tl.fromTo("#nt-mef", { y: 0 }, { y: 5, duration: 0.7, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, q0 + 0.6);
        if (LOOP) tl.fromTo("#nt-veil", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      }

      // ---- beat 4: 7:00 AM, nothing is done (alarm at +0.15, facepalm at the same rule as the sound) ----
      if (W) {
        var w0 = W[0],
          wl = W[1] - W[0];
        tl.to(["#nt-chat", "#nt-me", "#nt-mez", "#nt-melab"], { opacity: 0, scale: 0.9, duration: 0.3, ease: "power3.in" }, w0 - 0.25);
        tl.to("#nt-roomwrap", { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, w0 - 0.1);
        tl.to("#nt-dim", { opacity: 0, duration: 0.4 }, w0 - 0.1);
        // morning comes
        tl.to("#nr-shade", { opacity: 0, duration: 0.5 }, w0 - 0.1);
        tl.to(["#nr-stars", "#nr-moon", "#nr-scr"], { opacity: 0, duration: 0.4 }, w0 - 0.1);
        tl.to(["#nr-sky2", "#nr-sunwall", "#nr-sun", "#nr-room .rm-cloud"], { opacity: 1, duration: 0.6 }, w0 - 0.1);
        tl.fromTo("#nr-sun", { y: 120 }, { y: 0, duration: wl, ease: "sine.out", immediateRender: false }, w0);
        T.clock(tl, "nr", 7 * 60, 7 * 60, w0 - 0.1, 0.01);
        tl.to("#nr-laptop .lp-chat", { opacity: 0, duration: 0.01 }, w0 - 0.1);
        tl.to("#nr-laptop .lp-wait", { opacity: 1, duration: 0.01 }, w0 - 0.1);
        tl.to("#nr-clock", { opacity: 1, duration: 0.3 }, w0 - 0.1);
        var ta = w0 + 0.15;
        tl.fromTo("#nr-ring", { opacity: 0 }, { opacity: 1, duration: 0.12, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, ta);
        for (var k = 0; k < 14; k++) tl.to("#nr-clock", { rotation: k % 2 ? -3 : 3, duration: 0.07, ease: "none" }, ta + k * 0.075);
        tl.to("#nr-clock", { rotation: 0, duration: 0.1 }, ta + 1.05);
        // he sits up, sleepy (half-closed eyes, messy hair), sees the laptop, then the facepalm
        tl.to("#nr-char", { y: 0, rotation: 0, duration: 0.45, ease: "back.out(1.4)" }, w0 + 0.45);
        T.mood(tl, face, "sleepy", w0 + 0.45);
        var tsh = w0 + Math.min(1.2, wl * 0.4);
        T.mood(tl, face, "shocked", tsh);
        tl.fromTo("#nr-laptop", { scale: 1, transformOrigin: "50% 100%" }, { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, tsh);
        var tf = w0 + Math.min(2.2, wl - 0.5); // same rule as the sound (build-roots.js)
        T.mood(tl, face, "sleepy", tf - 0.2);
        tl.fromTo("#nr-char .c-hand", { opacity: 1, y: 320 }, { opacity: 1, y: -20, duration: 0.2, ease: "power3.in", immediateRender: false }, tf - 0.2);
        F.shake(tl, "#nr-char", tf, 0.26, 0.6);
        gsap.set("#nr-char .c-hand", { y: 320 });
      }

      // exit into the ignition
      tl.to(["#nt-roomwrap", "#nt-chat", "#nt-me", "#nt-mez", "#nt-melab", "#nt-brand", "#nt-dim"], { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.32);
      window.__timelines["night"] = tl;
    })();
  </script>
</template>
