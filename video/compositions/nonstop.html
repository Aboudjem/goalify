  <script>
    (function () {
      var F = window.Film;

      var hEl = document.getElementById("ns-h"),

      tl.fromTo("#ns-on", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
      // you sleep, happy (snore at +0.35): z z Z float up from the sleeper

      gsap.set("#ns-sf .f-hand", { opacity: 0 });
      tl.fromTo("#ns-sleep", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.15);
      tl.fromTo("#ns-sf", { y: 0 }, { y: 6, duration: 0.7, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.4);
      var sl = document.getElementById("ns-sleep");
      document.querySelectorAll(".ns-z").forEach(function (z, i) {
        var zx = sl.offsetLeft + sl.offsetWidth * 0.8 + i * 46,
          zy = sl.offsetTop + (P ? 110 - i * 34 : 20 - i * 52);
        z.style.left = zx + "px";
        z.style.top = zy + "px";
        z.style.fontSize = 40 + i * 16 + "px";
        [0, 1.6].forEach(function (o) {
          tl.fromTo(z, { opacity: 0, y: 20, x: 0 }, { keyframes: [{ opacity: 1, y: -20, x: 10, duration: 0.6, ease: "sine.out" }, { opacity: 0, y: -60, x: 24, duration: 0.6, ease: "sine.in" }], immediateRender: false }, 0.4 + i * 0.3 + o);

      tl.to(["#ns-sleep"], { opacity: 0, duration: 0.2 }, D - 0.28);
      tl.to("#ns-on", { opacity: 0, duration: 0.2 }, D - 0.24);
      // arrive from the zoom-through: the clock comes out of the /goal line
      // the result-first hook opens right on this shot: everything is already readable at frame 0
      var OPEN = F.cut() === "hook-c";

      // the time-lapse: one night of work, 11:30 PM to 6:48 AM (7 h 18 min, the same numbers as the summary)
      var clock = { m: 0 },
        END = 7 * 60 + 18,
        run = D - 0.75;
      tl.fromTo(clock, { m: 0 }, {
        m: END,
        duration: run,
        ease: "power2.in",
        onUpdate: function () {
          var m = Math.round(clock.m);
          hEl.textContent = Math.floor(m / 60);
          var tm = (23 * 60 + 30 + m) % (24 * 60),
            hh = Math.floor(tm / 60);
          dEl.textContent = (hh % 12 || 12) + ":" + ("0" + (tm % 60)).slice(-2) + (hh < 12 ? " AM" : " PM");
          mEl.textContent = ("0" + (m % 60)).slice(-2);
        },
      }, 0.2);
      // the moon crosses the sky and the sun comes up at the end (one night)
      var tint = document.getElementById("ns-tint");
      var arc = { a: 160 };
      tl.fromTo(arc, { a: 160 }, {
        a: 290,
        duration: run,
        ease: "power2.in",
        onUpdate: function () {
          gsap.set("#ns-arc", { rotation: arc.a });
          var rad = (arc.a * Math.PI) / 180;
          tint.style.opacity = Math.max(0, Math.cos(rad)).toFixed(3);
        },
      }, 0.2);
      tl.fromTo("#ns-streak", { x: 0 }, { x: 2900, duration: 0.9, ease: "power1.inOut" }, 0.7);
      // README loop: keep the sky still (no tint sweep, sun or streak) so the GIF stays small
      if (window.FILM_SKY && window.FILM_SKY.calm) gsap.set(["#ns-tint", "#ns-arc", "#ns-streak"], { display: "none" });
      tl.fromTo("#ns-day", { scale: 1 }, { scale: 1.12, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 0.2 + run - 0.2);
      tl.fromTo(".ns-pill", { opacity: OPEN ? 1 : 0, y: OPEN ? 0 : 20 }, { opacity: 1, y: 0, duration: OPEN ? 0.01 : 0.35, ease: "expo.out", stagger: OPEN ? 0 : 0.1 }, OPEN ? 0 : 0.35);
      tl.fromTo(".ns-pill", { boxShadow: "inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 0 rgba(95, 217, 160,0)" }, { boxShadow: "inset 0 1px 0 rgba(255,255,255,.2), 0 0 44px 0 rgba(95, 217, 160,0.35)", duration: 0.5, immediateRender: false }, 0.9);
      // the final time shatters (the next shot's VERIFIED forms from it)
      var ck = document.getElementById("ns-clock");

        cy = 0,
        e = ck;

        cx += e.offsetLeft;
        cy += e.offsetTop;
        e = e.offsetParent;

      cx += ck.offsetWidth / 2;
      cy += ck.offsetHeight / 2;
      F.burst(tl, document.getElementById("ns-fx"), cx, cy, D - 0.3, { n: 20, dist: 620, seed: 77, dur: 0.5, size: 12, colors: ["#f2f0f7", "#b8a6ff"] });
      tl.to("#ns-clock", { scale: 1.25, opacity: 0, filter: "blur(10px)", duration: 0.24, ease: "power3.in" }, D - 0.32);
      tl.to(["#ns-run", "#ns-sub", "#ns-pills", "#ns-tint", "#ns-arc"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, D - 0.28);
      window.__timelines["nonstop"] = tl;
    })();
