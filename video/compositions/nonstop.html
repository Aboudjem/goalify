<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }
    #ns-wrap {
      position: absolute;
      left: 0;
      right: 0;
      top: 128px;
      text-align: center;
    }
    #ns-on {
      position: absolute;

      color: var(--ink);

    }
    #ns-on b {
      font-family: var(--mono);
      color: var(--purple);
    }
    /* day and night sweep behind the clock */
    #ns-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(1400px 700px at 50% 0%, rgba(80, 170, 255, 0.34), rgba(46, 230, 255, 0.08) 55%, transparent 80%);
      opacity: 0;
    }
    #ns-arc {
      position: absolute;
      left: 960px;

      width: 0;

    }
    #ns-sun,
    #ns-moon {
      position: absolute;
      left: -44px;
      top: -1144px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
    }
    #ns-sun {
      background: radial-gradient(circle, #fff6c8 0%, #ffd23f 45%, rgba(255, 210, 63, 0) 72%);
      box-shadow: 0 0 80px 30px rgba(255, 210, 63, 0.35);
    }
    #ns-moon {
      transform: rotate(180deg);
      transform-origin: 44px 1144px;
      background: radial-gradient(circle at 38% 38%, #ffffff 0%, #d9d4ff 50%, rgba(217, 212, 255, 0) 72%);
      box-shadow: 0 0 50px 10px rgba(200, 190, 255, 0.25);
    }
    #ns-streak {
      position: absolute;

      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.10), rgba(46, 230, 255, 0.16), transparent);
      transform: rotate(18deg);

    #ns-run {

    #ns-clock {

  </style>
  <div id="root" data-composition-id="nonstop" data-width="1920" data-height="1080">
    <div class="cam" id="ns-cam"><div class="rig" id="ns-rig">
    <div id="ns-tint"></div>
    <div id="ns-arc"><div id="ns-sun"></div><div id="ns-moon"></div></div>
    <div id="ns-streak"></div>
    <div id="ns-on" class="glass">Claude Code and Codex</div>
    <div id="ns-wrap">
      <div id="ns-run" class="glass"><i></i>Working alone <em>· example run</em></div>
      <div id="ns-clock"><span id="ns-h">0</span><small>h</small><span id="ns-m">00</span><small>m</small></div>
      <div id="ns-sub"><span>no one at the keyboard</span><span id="ns-day">DAY 2</span></div>
      <div id="ns-pills">
        <div class="ns-pill glass"><b>0</b>questions asked</div>
        <div class="ns-pill glass"><b>0</b>interruptions</div>
      </div>
    </div>
    <div id="ns-fx"></div>
  </div></div>
  </div>
  <script>
    (function () {
      var F = window.Film;
      var MODE = F.cut();
      var D = MODE === "main" ? 3.25 : MODE === "short" ? 2.3 : 2.4; // slot length per cut
      var tl = gsap.timeline({ paused: true });
      window.Film.push(tl, "#ns-cam", 9, 1, 1.04);
      var hEl = document.getElementById("ns-h"),
        mEl = document.getElementById("ns-m");
      tl.fromTo("#ns-on", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
      tl.to("#ns-on", { opacity: 0, duration: 0.2 }, D - 0.24);
      // arrive from the zoom-through: the clock comes out of the /goal line
      tl.fromTo("#ns-wrap", { opacity: 0, scale: 1.7, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0);
      // the time-lapse: about 31 hours of work, accelerating
      var clock = { m: 0 },
        END = 31 * 60 + 12,
        run = D - 0.75;
      tl.fromTo(clock, { m: 0 }, {
        m: END,
        duration: run,
        ease: "power2.in",
        onUpdate: function () {
          var m = Math.round(clock.m);
          hEl.textContent = Math.floor(m / 60);
          mEl.textContent = ("0" + (m % 60)).slice(-2);
        },
      }, 0.2);
      // the sun and the moon wheel across the sky (about 1.3 turns for 31 hours)
      var tint = document.getElementById("ns-tint");
      var arc = { a: -70 };
      tl.fromTo(arc, { a: -70 }, {
        a: 400,
        duration: run,
        ease: "power2.in",
        onUpdate: function () {
          gsap.set("#ns-arc", { rotation: arc.a });
          var rad = (arc.a * Math.PI) / 180;
          tint.style.opacity = Math.max(0, Math.cos(rad)).toFixed(3);
        },
      }, 0.2);
      tl.fromTo("#ns-streak", { x: 0 }, { x: 2900, duration: 0.9, ease: "power1.inOut" }, 0.7);
      var tDay = 0.2 + run * Math.sqrt((24 * 60) / END);
      tl.fromTo("#ns-day", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, tDay);
      tl.fromTo(".ns-pill", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out", stagger: 0.1 }, 0.35);
      tl.fromTo(".ns-pill", { boxShadow: "inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 0 rgba(61,255,168,0)" }, { boxShadow: "inset 0 1px 0 rgba(255,255,255,.2), 0 0 44px 0 rgba(61,255,168,0.35)", duration: 0.5, immediateRender: false }, 0.9);
      // the final time shatters (the next shot's VERIFIED forms from it)
      var ck = document.getElementById("ns-clock");
      var cx = 0,
        cy = 0,
        e = ck;
      while (e && e.getAttribute("data-composition-id") !== "nonstop") {
        cx += e.offsetLeft;
        cy += e.offsetTop;
        e = e.offsetParent;
      }
      cx += ck.offsetWidth / 2;
      cy += ck.offsetHeight / 2;
      F.burst(tl, document.getElementById("ns-fx"), cx, cy, D - 0.3, { n: 46, dist: 620, seed: 77, dur: 0.5, size: 16, colors: ["#f1edff", "#9b6bff", "#2ee6ff", "#3dffa8"] });
      tl.to("#ns-clock", { scale: 1.25, opacity: 0, filter: "blur(10px)", duration: 0.24, ease: "power3.in" }, D - 0.32);
      tl.to(["#ns-run", "#ns-sub", "#ns-pills", "#ns-tint", "#ns-arc"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, D - 0.28);
      window.__timelines["nonstop"] = tl;
    })();
  </script>
