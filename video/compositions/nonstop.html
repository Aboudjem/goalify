  <div id="root" data-composition-id="nonstop" data-width="1920" data-height="1080">

      <div class="ns-eye">Done when</div>
      <div class="ns-h">The finish line, check by check</div>
      <div class="ns-row"><div class="ns-ok"><div class="ns-tick">✓</div></div><div><div class="ns-txt">No <span class="mono">api/v1</span> calls left in <span class="mono">src/</span>.</div><div class="ns-by"><span class="cmd">grep -rn "api/v1" src</span></div></div></div>
      <div class="ns-row"><div class="ns-ok"><div class="ns-tick">✓</div></div><div><div class="ns-txt">Types compile clean.</div><div class="ns-by"><span class="cmd">npx tsc --noEmit</span></div></div></div>
      <div class="ns-row"><div class="ns-ok"><div class="ns-tick">✓</div></div><div><div class="ns-txt"><span class="mono">npm test</span> exits 0, all passing.</div><div class="ns-by"><span class="cmd">npm test</span></div></div></div>
      <div class="ns-row"><div class="ns-ok"><div class="ns-tick">✓</div></div><div><div class="ns-txt">A separate agent confirmed the API contract.</div><div class="ns-by"><span class="cmd agent">checked by a separate agent</span></div></div></div>
    </div>
    <div class="cap" id="ns-cap">It runs for hours. Even days. Zero interruptions.</div>

  <script>
    (function () {
      var F = window.Film;
      var tl = gsap.timeline({ paused: true });
      var hEl = document.getElementById("ns-h"),
        mEl = document.getElementById("ns-m"),
        tEl = document.getElementById("ns-turn");

      tl.fromTo("#ns-left", { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0);
      tl.fromTo("#ns-card", { opacity: 0, x: 60, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.12);
      F.caption(tl, document.getElementById("ns-cap"), 0.35, 4.85);

      // the time-lapse: 31 h 12 m of work in four seconds, accelerating
      var clock = { m: 0 };
      tl.fromTo(
        clock,
        { m: 0 },
        {
          m: 31 * 60 + 12,
          duration: 3.9,
          ease: "power2.in",
          onUpdate: function () {
            var m = Math.round(clock.m);
            hEl.textContent = Math.floor(m / 60);
            mEl.textContent = ("0" + (m % 60)).slice(-2);
            tEl.textContent = Math.max(1, Math.round((m / (31 * 60 + 12)) * 27));
          },
        },
        0.25
      );
      // day 2 lands when the clock passes 24 h (power2.in: t = sqrt(24/31.2) of 3.9 s)
      var tDay = 0.25 + 3.9 * Math.sqrt((24 * 60) / (31 * 60 + 12));
      tl.fromTo("#ns-day", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.6)" }, tDay);
      tl.fromTo("#ns-zero", { boxShadow: "inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 0 rgba(61,255,168,0)" }, { boxShadow: "inset 0 1px 0 rgba(255,255,255,.2), 0 0 40px 0 rgba(61,255,168,0.35)", duration: 0.5, ease: "power2.out" }, 1.6);

      // the checks tick as the run proves each one
      document.querySelectorAll("#ns-card .ns-tick").forEach(function (k, i) {
        tl.fromTo(k, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.8)" }, 1.25 + i * 0.78);
      });

      tl.to(["#ns-left", "#ns-card"], { opacity: 0, scale: 0.96, filter: "blur(12px)", duration: 0.25, ease: "power3.in" }, 4.75);
      window.__timelines["nonstop"] = tl;
    })();
  </script>
