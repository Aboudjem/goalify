  <script>
    (function () {
      var F = window.Film;
      var P = F.portrait();
      var tl = gsap.timeline({ paused: true });

      // layout numbers (must match the CSS above)
      var FULL = P ? 636 : 776; // panel height with all 8 lines
      var SHOWN = P ? 64 + 60 + 2 * 64 : 64 + 72 + 2 * 80; // panel height showing 2 lines
      var DY = (FULL - SHOWN) / 2; // keep the visible part centred while it is short

      // strike-through spans the claim exactly (measured once from static layout)
      var dt = document.getElementById("op-dtxt");
      var dotW = document.getElementById("op-dot").offsetWidth;
      var strike = document.getElementById("op-strike");
      strike.style.left = dotW - 6 + "px";
      strike.style.width = dt.offsetWidth - dotW + 12 + "px";

      // HOOK: frame 0 already shows the prompt and "Done." (the thumbnail is the hook)
      tl.fromTo(
        "#op-term",
        { opacity: 1, y: DY, x: 0, scale: 1, filter: "blur(0px)", clipPath: "inset(0px 0px " + (FULL - SHOWN) + "px 0px round 28px)" },
        { opacity: 1, y: DY, duration: 0.01 },
        0
      );
      F.caption(tl, document.getElementById("op-cap1"), 0.1, 1.5);

      // PROBLEM: the panel opens and the test run contradicts it
      tl.to("#op-term", { y: 0, clipPath: "inset(0px 0px 0px 0px round 28px)", duration: 0.42, ease: "power3.inOut" }, 0.95);
      tl.fromTo("#op-l4", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 1.05);
      F.type(tl, document.getElementById("op-l4t"), 1.07, 0.2);
      tl.fromTo("#op-l5", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.18, ease: "expo.out" }, 1.45);
      tl.fromTo("#op-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, 1.47);
      tl.to("#op-dtxt", { opacity: 0.42, duration: 0.2 }, 1.5);
      var R = F.rng(9);
      for (var i = 0; i < 6; i++) {
        tl.to("#op-term", { x: (R() - 0.5) * 20 * (1 - i / 6), duration: 0.035, ease: "none" }, 1.47 + i * 0.035);
      }
      tl.to("#op-term", { x: 0, duration: 0.05 }, 1.7);
      F.caption(tl, document.getElementById("op-cap2"), 1.52, 4.25);
      tl.fromTo("#op-l6", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 1.85);
      F.type(tl, document.getElementById("op-l6t"), 1.87, 0.34);
      tl.fromTo(".op-f", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.2, ease: "expo.out", stagger: 0.16 }, 2.3);
      tl.fromTo(".op-chip", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.16 }, 2.38);

      // EXIT: the terminal collapses into a point at the mark's centre (the next scene ignites from it)
      var markY = P ? 520 : 440;
      var termTop = P ? 290 : 70;
      tl.to(
        "#op-term",
        { scale: 0.14, y: markY - (termTop + FULL / 2), opacity: 0, filter: "blur(18px)", duration: 0.34, ease: "power3.in", transformOrigin: "50% 50%" },
        4.24
      );

      window.__timelines["open"] = tl;
    })();
