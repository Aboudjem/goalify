<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }
    #pf-wash {
      position: absolute;
      inset: 0;
      background: radial-gradient(900px 600px at 50% 40%, rgba(61, 255, 168, 0.32), transparent 70%);
      opacity: 0;
    }
    #pf-card {
      position: absolute;
      left: 210px;

      width: 1500px;

      background: rgba(61, 255, 168, 0.1);

    }
    #pf-word {
      font: 700 40px/1.1 var(--sans);

    }
    #pf-note {
      margin-top: 8px;

    @media (max-aspect-ratio: 1/1) {
      #pf-card {
        left: 40px;

        margin-top: 26px;

        flex-wrap: wrap;

        width: 100%;
        margin-left: 0;

      }
    }
  </style>
  <div id="root" data-composition-id="proof" data-width="1920" data-height="1080">
    <div id="pf-wash"></div>
    <div id="pf-card" class="glass">
      <span id="pf-badge" class="glass"><i></i>Proof receipt · /goalify verify · example</span>
      <div id="pf-h1">Move acme to the v2 API (tests green)</div>
      <div id="pf-vrow">
        <span id="pf-verdict">VERIFIED</span>
        <div id="pf-vtext">
          <div id="pf-word"><span class="grad" id="pf-grad">Proven, not promised.</span></div>
          <div id="pf-note">3 of 3 check commands passed when re-run just now, in this repo.</div>
        </div>
      </div>
      <div id="pf-rows">
        <div class="pf-row"><span class="st pass">PASS</span><span class="cmd">grep -rn "api/v1" src</span><span class="pf-out">(no output)</span></div>
        <div class="pf-row"><span class="st pass">PASS</span><span class="cmd">npx tsc --noEmit</span><span class="pf-out">(no output)</span></div>
        <div class="pf-row"><span class="st pass">PASS</span><span class="cmd">npm test</span><span class="pf-out"># pass 42 · # fail 0</span></div>
        <div class="pf-row"><span class="st skip">CLAIMED</span><span class="cmd agent">checked by a separate agent</span></div>
      </div>
    </div>
    <div id="pf-ring"></div>
    <div id="pf-sparks"></div>
    <div class="cap" id="pf-cap">It ends on proof you can re-run.</div>
  </div>
  <script>
    (function () {
      var F = window.Film;
      var P = F.portrait();
      var tl = gsap.timeline({ paused: true });

      // centre of the verdict pill in scene coordinates (layout offsets, measured once)
      function off(el) {
        var x = 0,
          y = 0,
          w = el.offsetWidth,
          h = el.offsetHeight;
        while (el && el.getAttribute("data-composition-id") !== "proof") {
          x += el.offsetLeft;
          y += el.offsetTop;
          el = el.offsetParent;
        }
        return { x: x + w / 2, y: y + h / 2 };
      }
      var vc = off(document.getElementById("pf-verdict"));
      var ring = document.getElementById("pf-ring");
      ring.style.left = vc.x + "px";
      ring.style.top = vc.y + "px";

      var box = document.getElementById("pf-sparks");
      var R = F.rng(311);
      var cols = ["#3dffa8", "#ffffff", "#2ee6ff", "#3dffa8", "#ffd23f"];
      var sp = [];
      for (var i = 0; i < 40; i++) {
        var d = document.createElement("div");
        d.className = "pf-spark";
        var c = cols[(R() * cols.length) | 0],
          sz = 3 + R() * 6;
        d.style.width = d.style.height = sz + "px";
        d.style.left = vc.x - sz / 2 + "px";
        d.style.top = vc.y - sz / 2 + "px";
        d.style.background = c;
        d.style.boxShadow = "0 0 " + (8 + sz * 2) + "px " + c;
        box.appendChild(d);
        var a = R() * Math.PI * 2,
          dist = 220 + R() * 420;
        sp.push({ el: d, x: Math.cos(a) * dist, y: Math.sin(a) * dist * 0.7, dl: R() * 0.1 });
      }

      tl.fromTo("#pf-card", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0);
      tl.fromTo(["#pf-badge", "#pf-h1"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out", stagger: 0.06 }, 0.0);
      var capEl = document.getElementById("pf-cap");
      if (window.FILM_CAPS && window.FILM_CAPS.proof) capEl.textContent = window.FILM_CAPS.proof;
      F.caption(tl, capEl, 0.2, null);
      document.querySelectorAll(".pf-row").forEach(function (r, i) {
        tl.fromTo(r, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, 0.08 + i * 0.12);
        tl.fromTo(r.children[0], { scale: 0.4 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.12 + i * 0.12);
      });

      // THE MOMENT: the verdict slams in
      var T = 1.2;
      tl.fromTo("#pf-verdict", { opacity: 0, scale: 2.6, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power4.in" }, T - 0.32);
      tl.fromTo("#pf-card", { x: 0 }, { x: 0, duration: 0.01 }, T - 0.01);
      tl.to("#pf-card", { y: 7, duration: 0.05, ease: "power2.out" }, T);
      tl.to("#pf-card", { y: 0, duration: 0.4, ease: "elastic.out(1, 0.4)" }, T + 0.05);
      tl.fromTo("#pf-wash", { opacity: 0 }, { opacity: 1, duration: 0.08 }, T);
      tl.to("#pf-wash", { opacity: 0.25, duration: 1.2, ease: "power2.out" }, T + 0.1);
      tl.fromTo(ring, { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: P ? 4.5 : 5.5, duration: 0.85, ease: "power2.out", immediateRender: false }, T);
      sp.forEach(function (s) {
        tl.fromTo(s.el, { x: 0, y: 0, opacity: 0 }, { x: s.x, y: s.y, opacity: 1, duration: 0.9, ease: "power3.out" }, T + s.dl);
        tl.to(s.el, { opacity: 0, duration: 0.4, ease: "power2.in" }, T + 0.55 + s.dl);
      });
      tl.fromTo("#pf-vtext", { opacity: 0, x: P ? 0 : -20, y: P ? 10 : 0 }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: "expo.out" }, T + 0.22);
      tl.fromTo("#pf-grad", { backgroundPosition: "0% 0" }, { backgroundPosition: "100% 0", duration: 3, ease: "none" }, T + 0.2);

      tl.to(["#pf-card", "#pf-wash"], { opacity: 0, scale: 0.97, filter: "blur(12px)", duration: 0.24, ease: "power3.in" }, 4.26);
      tl.to("#pf-cap", { opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.in" }, 4.32);

      window.__timelines["proof"] = tl;
    })();
  </script>
</template>
