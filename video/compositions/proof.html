<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }
    #pf-wash {
      position: absolute;
      inset: 0;
      background: radial-gradient(900px 600px at 50% 30%, rgba(61, 255, 168, 0.3), transparent 70%);
      opacity: 0;
    }
    #pf-top {
      position: absolute;
      left: 0;
      right: 0;
      top: 96px;
      text-align: center;
    }
    #pf-verdict {
      display: inline-flex;
      align-items: center;
      padding: 22px 64px;
      border-radius: 999px;
      font: 850 112px/1 var(--sans);
      letter-spacing: 0.03em;
      color: var(--green);
      background: rgba(61, 255, 168, 0.1);
      border: 3px solid rgba(61, 255, 168, 0.6);
      box-shadow: 0 0 90px -10px rgba(61, 255, 168, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    #pf-word {
      margin-top: 22px;
      font: 700 44px/1.1 var(--sans);
      letter-spacing: -0.03em;
    }
    #pf-did {
      position: absolute;
      left: 460px;
      top: 390px;
      width: 1000px;
      padding: 36px 48px 24px;
    }
    #pf-dh {
      display: flex;
      align-items: center;
      gap: 18px;
      font: 750 46px/1 var(--sans);
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }
    #pf-dh span {
      margin-left: auto;
      padding: 6px 16px;
      border-radius: 999px;
      font: 600 22px var(--sans);
      color: var(--dim);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
    }
    .pf-li {
      display: flex;
      align-items: center;
      gap: 22px;
      height: 92px;
      border-top: 1px solid var(--line);
      font: 650 48px/1 var(--sans);
      letter-spacing: -0.02em;
    }
    .pf-li b {
      flex: none;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 800 28px var(--sans);
      color: var(--green);
      border: 3px solid var(--green);
      background: rgba(61, 255, 168, 0.12);
    }
    #pf-ring {
      position: absolute;
      width: 220px;
      height: 220px;
      margin: -110px 0 0 -110px;
      border-radius: 50%;
      border: 4px solid var(--green);
      opacity: 0;
    }
    .pf-spark {
      position: absolute;
      border-radius: 50%;
    }
    @media (max-aspect-ratio: 1/1) {
      #pf-top {
        top: 220px;
      }
      #pf-verdict {
        font-size: 104px;
        padding: 22px 54px;
      }
      #pf-did {
        left: 50px;
        top: 520px;
        width: 980px;
        padding: 34px 42px 20px;
      }
      #pf-dh {
        font-size: 46px;
      }
      .pf-li {
        height: 100px;
        font-size: 50px;
      }
    }
  </style>
  <div id="root" data-composition-id="proof" data-width="1920" data-height="1080">
    <div class="cam" id="pf-cam"><div class="rig" id="pf-rig">
    <div id="pf-wash"></div>
    <div id="pf-top">
      <span id="pf-verdict">VERIFIED</span>
      <div id="pf-word"><span class="grad" id="pf-grad">Proven, not promised.</span></div>
    </div>
    <div id="pf-did" class="glass">
      <div id="pf-dh">Here's what I did<span>example</span></div>
      <div class="pf-li"><b>✓</b>6 pages built</div>
      <div class="pf-li"><b>✓</b>Menu with 24 cakes and prices</div>
      <div class="pf-li"><b>✓</b>Online orders work</div>
    </div>
    <div id="pf-ring"></div>
    <div id="pf-sparks"></div>
  </div></div>
  </div>
  <script>
    (function () {
      var F = window.Film;
      var P = F.portrait();
      var MODE = F.cut();
      var tl = gsap.timeline({ paused: true });
      window.Film.push(tl, "#pf-cam", 9, 1, 1.04);
      var T = MODE === "short" ? 0.22 : MODE === "demo" ? 0.35 : 0.22; // the slam (it forms out of the shattered clock)
      var TD = MODE === "short" ? 0.38 : MODE === "demo" ? 1.0 : 1.45; // "what I did"
      var END = MODE === "short" ? null : MODE === "demo" ? 2.56 : 4.08;

      function off(el) {
        var x = 0,
          y = 0,
          w = el.offsetWidth,
          h = el.offsetHeight;
        while (el && el.getAttribute("data-composition-id") !== "proof") {
          x += el.offsetLeft;
          y += el.offsetTop;
          el = el.offsetParent;
        }
        return { x: x + w / 2, y: y + h / 2 };
      }
      var vc = off(document.getElementById("pf-verdict"));
      var ring = document.getElementById("pf-ring");
      ring.style.left = vc.x + "px";
      ring.style.top = vc.y + "px";
      var box = document.getElementById("pf-sparks");
      var R = F.rng(311);
      var cols = ["#3dffa8", "#ffffff", "#2ee6ff", "#3dffa8", "#ffd23f"];
      var sp = [];
      for (var i = 0; i < 40; i++) {
        var d = document.createElement("div");
        d.className = "pf-spark";
        var c = cols[(R() * cols.length) | 0],
          sz = 3 + R() * 6;
        d.style.width = d.style.height = sz + "px";
        d.style.left = vc.x - sz / 2 + "px";
        d.style.top = vc.y - sz / 2 + "px";
        d.style.background = c;
        d.style.boxShadow = "0 0 " + (8 + sz * 2) + "px " + c;
        box.appendChild(d);
        var a = R() * Math.PI * 2,
          dist = 240 + R() * 460;
        sp.push({ el: d, x: Math.cos(a) * dist, y: Math.sin(a) * dist * 0.7, dl: R() * 0.1 });
      }

      tl.fromTo("#pf-verdict", { opacity: 0.25, scale: 2.4, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.in" }, T - 0.22);
      tl.fromTo("#pf-wash", { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, T);
      tl.to("#pf-wash", { opacity: 0.22, duration: 1.2, ease: "power2.out" }, T + 0.1);
      tl.fromTo(ring, { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: P ? 4.5 : 6, duration: 0.85, ease: "power2.out", immediateRender: false }, T);
      sp.forEach(function (s) {
        tl.fromTo(s.el, { x: 0, y: 0, opacity: 0 }, { x: s.x, y: s.y, opacity: 1, duration: 0.9, ease: "power3.out" }, T + s.dl);
        tl.to(s.el, { opacity: 0, duration: 0.4, ease: "power2.in" }, T + 0.55 + s.dl);
      });
      // star confetti in the palette, with gravity, and a short camera punch-in
      F.burst(tl, document.getElementById("pf-sparks"), vc.x, vc.y, T + 0.02, { n: 54, dist: 560, seed: 909, dur: 1.5, size: 16, star: true, gravity: 420, colors: ["#9b6bff", "#2ee6ff", "#ff3d9a", "#ffd23f", "#3dffa8", "#ffffff"] });
      tl.fromTo("#pf-rig", { scale: 1 }, { scale: 1.08, duration: 0.09, ease: "power2.out", immediateRender: false }, T);
      tl.to("#pf-rig", { scale: 1.0, duration: 0.6, ease: "elastic.out(1, 0.55)" }, T + 0.09);
      tl.fromTo("#pf-word", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, T + 0.2);
      tl.fromTo("#pf-grad", { backgroundPosition: "0% 0" }, { backgroundPosition: "100% 0", duration: 3, ease: "none" }, T + 0.2);

      // then: here's what it did
      tl.fromTo("#pf-did", { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, TD);
      document.querySelectorAll("#pf-did .pf-li").forEach(function (r, i) {
        var t = TD + (MODE === "short" ? 0.08 : 0.15) + i * (MODE === "main" ? 0.22 : MODE === "short" ? 0.18 : 0.12);
        tl.fromTo(r, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, t);
        tl.fromTo(r.children[0], { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.05);
      });
      if (END && MODE === "main") {
        // carry: the "what I did" card shrinks into the install box of the next shot
        var did = document.getElementById("pf-did");
        var cy = P ? 580 : 380;
        tl.to(["#pf-top", "#pf-wash"], { opacity: 0, filter: "blur(12px)", duration: 0.22, ease: "power3.in" }, END - 0.05);
        tl.to("#pf-did", { y: cy - (did.offsetTop + did.offsetHeight / 2), scaleY: 0.32, scaleX: P ? 0.95 : 1.12, opacity: 0.2, duration: 0.3, ease: "power3.in" }, END - 0.05);
      } else if (END) tl.to(["#pf-top", "#pf-did", "#pf-wash"], { opacity: 0, filter: "blur(12px)", duration: 0.22, ease: "power3.in" }, END);
      window.__timelines["proof"] = tl;
    })();
  </script>
</template>
