        cx.beginPath();
        cx.arc(R() * cv.width, R() * cv.height, r, 0, 6.283);
        cx.fill();
      }

      var page = document.getElementById("pv-page");
      var yPlan = document.getElementById("pv-plan").offsetTop - 26;

      // the short summary in Claude first
